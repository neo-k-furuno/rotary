<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/manifest.json">
<title>ロータリー受付</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  font-family: 'Noto Sans JP', 'Hiragino Sans', -apple-system, sans-serif;
  background: #f7f7f7;
  color: #2c2c2c;
  overflow: hidden;
}

/* ── Connection status bar ── */
.conn-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  height: 0;
  overflow: hidden;
  transition: height 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #fff;
}
.conn-bar.show { height: 28px; }
.conn-bar.offline { background: #c8102e; }
.conn-bar.syncing { background: #d97706; }
.conn-bar .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #fff; margin-right: 8px;
  animation: cblink 1.2s infinite;
}
@keyframes cblink { 0%,100%{opacity:1} 50%{opacity:0.3} }

body.has-conn-bar .screen { padding-top: 28px; }

.screen { display: none; height: 100vh; flex-direction: column; position: relative; }
.screen.active { display: flex; }

/* ── Header ── */
.header {
  background: #fff;
  border-bottom: 1px solid #e5e5e5;
  padding: 16px 28px;
  display: flex;
  align-items: center;
  gap: 20px;
  flex-shrink: 0;
}
.header-center {
  flex: 1;
  display: flex;
  justify-content: center;
}
.header-center img {
  height: 80px;
  width: auto;
  object-fit: contain;
}
.breadcrumb {
  font-size: 13px;
  font-weight: 400;
  color: #999;
  letter-spacing: 0.5px;
}

.btn-back {
  background: #fff;
  border: 1px solid #d0d0d0;
  color: #2c2c2c;
  font-size: 14px;
  font-weight: 500;
  padding: 10px 20px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.5px;
}
.btn-back:active { background: #f2f2f2; }

/* ── Card Grid ── */
.card-grid {
  flex: 1;
  overflow-y: auto;
  padding: 28px;
  padding-right: 260px;
  display: grid;
  gap: 14px;
  align-content: start;
  -webkit-overflow-scrolling: touch;
}
.card-grid.groups { grid-template-columns: repeat(3, 1fr); }
.card-grid.clubs  { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }

/* ── Cards ── */
.card {
  position: relative;
  border-radius: 8px;
  padding: 32px 20px;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.12s, box-shadow 0.12s;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 110px;
  overflow: hidden;
  letter-spacing: 1px;
}
.card:active { transform: scale(0.97); }

.card.group {
  background: #fff;
  border: 1px solid #e0e0e0;
  color: #2c2c2c;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
  border-left: 4px solid #c8102e;
}
.card.group:active {
  box-shadow: 0 2px 12px rgba(200,16,46,0.10);
  border-color: #e0e0e0;
  border-left-color: #c8102e;
}

.card.club {
  background: #fff;
  border: 1px solid #e0e0e0;
  color: #2c2c2c;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.card.club:active {
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  border-color: #c8102e;
}

/* ── Member screen ── */
.member-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 260px 20px 24px;
  -webkit-overflow-scrolling: touch;
}

.section-label {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  margin: 20px 0 10px;
  padding: 8px 12px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
  text-transform: uppercase;
}
.section-label.unattended {
  background: #fff5f5;
  border-left: 3px solid #c8102e;
  color: #c8102e;
}
.section-label.attended {
  background: #f0f9f4;
  border-left: 3px solid #2e7d32;
  color: #2e7d32;
}
.section-label .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  animation: blink 1.8s ease-in-out infinite;
}
.section-label.unattended .dot { background: #c8102e; }
.section-label.attended .dot { background: #2e7d32; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

.member-grid {
  display: grid;
  gap: 10px;
  margin-bottom: 16px;
}
.member-grid.large { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.member-grid.small { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }

.member-card {
  position: relative;
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  padding: 20px 12px;
  text-align: center;
  font-size: 20px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.12s;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  color: #2c2c2c;
}
.member-card:active { transform: scale(0.96); }
.member-card.selected {
  background: #c8102e;
  border-color: #c8102e;
  color: #fff;
  box-shadow: 0 2px 12px rgba(200,16,46,0.20);
}
.member-card.selected::after {
  content: '✓';
  position: absolute;
  top: 4px;
  right: 8px;
  font-size: 12px;
  color: rgba(255,255,255,0.6);
}

.member-card.small-card {
  padding: 10px 8px;
  font-size: 13px;
  font-weight: 500;
  background: #f8faf8;
  border-color: #c8e6c9;
  color: #2e7d32;
}
.member-card.small-card.disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ── Bottom register bar ── */
.register-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 50;
  background: rgba(255,255,255,0.96);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid #e5e5e5;
  padding: 14px 28px;
  padding-bottom: max(14px, env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  gap: 20px;
}
.register-count {
  font-size: 16px;
  font-weight: 700;
  color: #c8102e;
  white-space: nowrap;
}
.register-count span { font-size: 22px; }

.btn-confirm {
  flex: 1;
  background: #c8102e;
  color: #fff;
  border: none;
  font-size: 20px;
  font-weight: 700;
  padding: 18px 24px;
  border-radius: 8px;
  cursor: pointer;
  letter-spacing: 2px;
  box-shadow: 0 2px 8px rgba(200,16,46,0.18);
  transition: all 0.12s;
}
.btn-confirm:disabled {
  background: #e0e0e0;
  box-shadow: none;
  color: #aaa;
  cursor: not-allowed;
}
.btn-confirm:not(:disabled):active {
  transform: scale(0.98);
  background: #a00d24;
  box-shadow: 0 2px 16px rgba(200,16,46,0.30);
}

/* ── Modal ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.active { display: flex; }

.modal {
  background: #fff;
  border-radius: 12px;
  padding: 32px;
  max-width: 480px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.12);
}
.modal-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 2px;
  text-align: center;
  margin-bottom: 24px;
  color: #2c2c2c;
  padding-bottom: 16px;
  border-bottom: 2px solid #c8102e;
}
.modal-list {
  list-style: none;
  display: grid;
  gap: 8px;
  margin-bottom: 28px;
}
.modal-item {
  background: #fafafa;
  border: 1px solid #e5e5e5;
  border-radius: 8px;
  padding: 14px;
  font-size: 20px;
  font-weight: 500;
  text-align: center;
  color: #2c2c2c;
}
.modal-actions {
  display: flex;
  gap: 12px;
}
.btn-modal-cancel {
  flex: 0 0 auto;
  background: #fff;
  border: 1px solid #d0d0d0;
  color: #666;
  font-size: 15px;
  font-weight: 500;
  padding: 14px 24px;
  border-radius: 8px;
  cursor: pointer;
}
.btn-modal-cancel:active { background: #f5f5f5; }
.btn-modal-register {
  flex: 1;
  background: #c8102e;
  color: #fff;
  border: none;
  font-size: 18px;
  font-weight: 700;
  padding: 16px;
  border-radius: 8px;
  cursor: pointer;
  letter-spacing: 1px;
  box-shadow: 0 2px 8px rgba(200,16,46,0.18);
}
.btn-modal-register:active {
  background: #a00d24;
  box-shadow: 0 2px 16px rgba(200,16,46,0.30);
}
.modal-warn {
  background: #fff5f5;
  border: 1px solid #fecaca;
  color: #c8102e;
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 16px;
  text-align: center;
}
.modal-item.dup {
  background: #fff5f5;
  border-color: #fecaca;
  color: #c8102e;
  font-size: 16px;
}
.modal-item .ts {
  display: inline-block;
  margin-left: 12px;
  font-size: 12px;
  color: #999;
  font-weight: 400;
}
.modal-item.dup .ts { color: #c8102e; opacity: 0.7; }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(15,23,42,0.94);
  color: #fff;
  padding: 14px 22px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 12px 30px rgba(0,0,0,0.18);
  z-index: 250;
  opacity: 0;
  transition: opacity 0.25s, transform 0.25s;
  pointer-events: none;
  max-width: 80%;
  text-align: center;
  letter-spacing: 0.5px;
  line-height: 1.5;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.toast.warn { background: rgba(200,16,46,0.94); }

/* ── Done screen warn ── */
.done-warn {
  margin-top: 8px;
  padding: 10px 16px;
  background: #fff5f5;
  border: 1px solid #fecaca;
  border-radius: 8px;
  color: #c8102e;
  font-size: 13px;
  font-weight: 500;
  max-width: 480px;
  text-align: center;
  line-height: 1.5;
}

/* ── Done screen ── */
.done-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 20px;
  background: #fff;
}
.done-ring {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: #f0f9f4;
  border: 2px solid #c8e6c9;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  color: #2e7d32;
  animation: doneIn 0.4s ease-out;
}
@keyframes doneIn {
  0% { transform: scale(0.6); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.done-screen { position: relative; }
.done-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  animation: doneIn 0.5s ease-out;
}
.done-mascot {
  position: absolute;
  right: 20px;
  bottom: 20px;
  animation: doneIn 0.6s ease-out;
}
.done-mascot-body {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.done-mascot-body img {
  width: 300px;
  height: auto;
}
.done-bubble {
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  margin-bottom: 8px;
  background: #fff;
  border: 2px solid #d0d0d0;
  border-radius: 20px;
  padding: 14px 20px;
  font-size: 18px;
  font-weight: 700;
  color: #2c2c2c;
  line-height: 1.5;
  white-space: nowrap;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}
.done-bubble::after {
  content: '';
  position: absolute;
  bottom: -12px;
  left: 50%;
  margin-left: -10px;
  border-width: 12px 10px 0 10px;
  border-style: solid;
  border-color: #fff transparent transparent transparent;
}
.done-bubble::before {
  content: '';
  position: absolute;
  bottom: -15px;
  left: 50%;
  margin-left: -11px;
  border-width: 13px 11px 0 11px;
  border-style: solid;
  border-color: #d0d0d0 transparent transparent transparent;
}

.done-msg {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 4px;
  color: #2c2c2c;
}
.done-detail {
  font-size: 15px;
  color: #999;
  font-weight: 400;
}
.btn-home {
  margin-top: 12px;
  background: #c8102e;
  color: #fff;
  border: none;
  font-size: 16px;
  font-weight: 700;
  padding: 16px 48px;
  border-radius: 8px;
  cursor: pointer;
  letter-spacing: 2px;
  box-shadow: 0 2px 8px rgba(200,16,46,0.18);
}
.btn-home:active { background: #a00d24; }

/* ── Mascot ── */
.mascot {
  position: fixed;
  top: 0;
  right: 0;
  width: 260px;
  height: 100vh;
  z-index: 40;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding-bottom: 20px;
  pointer-events: none;
  transition: opacity 0.3s;
}
.mascot.above-register {
  padding-bottom: 90px;
}
.mascot-body {
  position: relative;
}
.mascot-body img {
  width: 240px;
  height: auto;
}
.mascot-bubble {
  position: absolute;
  bottom: 100%;
  left: 50%;
  transform: translateX(-50%);
  margin-bottom: 8px;
  background: #fff;
  border: 2px solid #d0d0d0;
  border-radius: 20px;
  padding: 14px 18px;
  font-size: 15px;
  font-weight: 600;
  color: #2c2c2c;
  line-height: 1.5;
  width: 230px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  white-space: normal;
}
.mascot-bubble::after {
  content: '';
  position: absolute;
  bottom: -12px;
  left: 50%;
  margin-left: -10px;
  border-width: 12px 10px 0 10px;
  border-style: solid;
  border-color: #fff transparent transparent transparent;
}
.mascot-bubble::before {
  content: '';
  position: absolute;
  bottom: -15px;
  left: 50%;
  margin-left: -11px;
  border-width: 13px 11px 0 11px;
  border-style: solid;
  border-color: #d0d0d0 transparent transparent transparent;
}
.mascot-name {
  position: absolute;
  bottom: 18%;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,0.85);
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  color: #333;
  letter-spacing: 1px;
  white-space: nowrap;
  border: 1px solid #e0e0e0;
}

/* ── Loading splash ── */
.splash {
  position: fixed;
  inset: 0;
  background: #fff;
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
  transition: opacity 0.3s;
}
.splash.hidden { opacity: 0; pointer-events: none; }
.splash-spinner {
  width: 36px; height: 36px;
  border: 3px solid #f0f0f0;
  border-top-color: #c8102e;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.splash-text { color: #666; font-size: 14px; letter-spacing: 1px; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 2px; }
</style>
</head>
<body>

<!-- Connection status bar -->
<div class="conn-bar" id="conn-bar">
  <span class="dot"></span><span id="conn-text">オフライン中</span>
</div>

<!-- Splash (initial load) -->
<div class="splash" id="splash">
  <div class="splash-spinner"></div>
  <div class="splash-text">読み込み中...</div>
</div>

<!-- Screen 1: Group Selection -->
<div id="screen-groups" class="screen active">
  <div class="header">
    <div class="header-center">
      <img src="/logo-rotary-district2700.png" alt="Rotary District 2700">
    </div>
  </div>
  <div id="group-grid" class="card-grid groups"></div>
</div>

<!-- Screen 2: Club Selection -->
<div id="screen-clubs" class="screen">
  <div class="header">
    <button class="btn-back" onclick="showScreen('groups')">← 戻る</button>
    <h1><span id="club-title">クラブ選択</span></h1>
  </div>
  <div id="club-grid" class="card-grid clubs"></div>
</div>

<!-- Screen 3: Member Selection -->
<div id="screen-members" class="screen">
  <div class="header">
    <button class="btn-back" onclick="showScreen('clubs')">← 戻る</button>
    <h1><span id="member-title">名前選択</span></h1>
  </div>
  <div class="member-area" id="member-area" style="padding-bottom: 160px;"></div>
  <div class="register-bar" id="register-bar">
    <div class="register-count"><span id="selected-count">0</span> 名選択中</div>
    <button class="btn-confirm" id="btn-to-confirm" disabled onclick="showConfirmModal()">登録する</button>
  </div>
</div>

<!-- Screen 4: Done -->
<div id="screen-done" class="screen done-screen">
  <div class="done-center">
    <div class="done-ring">✓</div>
    <div class="done-msg">登録完了</div>
    <div class="done-detail" id="done-detail"></div>
    <div class="done-warn" id="done-warn" style="display:none;"></div>
    <button class="btn-home" onclick="showScreen('groups')">トップへ戻る</button>
  </div>
  <div class="done-mascot">
    <div class="done-mascot-body">
      <div class="done-bubble">出席が登録されました！</div>
      <img src="/mascot.png" alt="マスコット">
    </div>
  </div>
</div>

<!-- Confirm register Modal -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal">
    <div class="modal-title">出席登録の確認</div>
    <div class="modal-warn modal-warn-slot" style="display:none;"></div>
    <ul class="modal-list" id="confirm-list"></ul>
    <div class="modal-actions">
      <button class="btn-modal-cancel" onclick="hideConfirmModal()">戻る</button>
      <button class="btn-modal-register" onclick="registerAttendance()">登録する</button>
    </div>
  </div>
</div>

<!-- Cancel Modal (出席取消) -->
<div class="modal-overlay" id="cancel-modal">
  <div class="modal">
    <div class="modal-title">出席を取り消す</div>
    <ul class="modal-list">
      <li class="modal-item" id="cancel-name"></li>
    </ul>
    <div class="modal-warn">この操作は取り消せません</div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" onclick="hideCancelModal()">戻る</button>
      <button class="btn-modal-register" onclick="confirmCancel()">取り消す</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Mascot -->
<div class="mascot" id="mascot">
  <div class="mascot-body">
    <div class="mascot-bubble" id="mascot-bubble">ようこそ！グループを選択してください</div>
    <img src="/mascot.png" alt="マスコット">
    <div class="mascot-name">ガバナーエレクト 戸嶋 和夫</div>
  </div>
</div>

<script src="/sync.js?v=4"></script>
<script>
const mascotMessages = {
  groups: 'ようこそ！グループを選択してください',
  clubs: 'クラブを選択してください',
  members: '出席する方の名前をタップしてください',
  done: 'ありがとうございます！'
};

function updateMascot(screen) {
  const bubble = document.getElementById('mascot-bubble');
  const mascot = document.getElementById('mascot');
  if (mascotMessages[screen]) {
    bubble.textContent = mascotMessages[screen];
  }
  mascot.style.opacity = screen === 'done' ? '0' : '1';
  if (screen === 'members') {
    mascot.classList.add('above-register');
  } else {
    mascot.classList.remove('above-register');
  }
}

let currentScreen = 'groups';
let currentGroupId = null;
let currentGroupName = '';
let currentClubId = null;
let currentClubName = '';
let selectedIds = new Set();
let cancelTargetId = null;

function showScreen(name) {
  currentScreen = name;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  if (name === 'groups') { renderGroups(); selectedIds.clear(); }
  if (name === 'clubs')  { renderClubs(); }
  if (name === 'members'){ renderMembers(); }
  updateMascot(name);
}

function renderGroups() {
  const groups = RA.getGroups();
  const grid = document.getElementById('group-grid');
  grid.innerHTML = groups.map(g =>
    `<div class="card group" data-id="${g.id}" data-name="${esc(g.name)}">${esc(g.name)}</div>`
  ).join('');
  for (const el of grid.querySelectorAll('.card.group')) {
    el.addEventListener('click', () => selectGroup(Number(el.dataset.id), el.dataset.name));
  }
}

function selectGroup(id, name) {
  currentGroupId = id;
  currentGroupName = name;
  document.getElementById('club-title').textContent = name;
  showScreen('clubs');
}

function renderClubs() {
  if (!currentGroupId) return;
  const clubs = RA.getClubsByGroup(currentGroupId);
  const grid = document.getElementById('club-grid');
  grid.innerHTML = clubs.map(c =>
    `<div class="card club" data-id="${c.id}" data-name="${esc(c.name)}">${esc(c.name)}</div>`
  ).join('');
  for (const el of grid.querySelectorAll('.card.club')) {
    el.addEventListener('click', () => selectClub(Number(el.dataset.id), el.dataset.name));
  }
}

function selectClub(id, name) {
  currentClubId = id;
  currentClubName = name;
  selectedIds.clear();
  document.getElementById('member-title').textContent = currentGroupName + ' / ' + name;
  showScreen('members');
}

function renderMembers() {
  if (!currentClubId) return;
  const members = RA.getMembersByClub(currentClubId);
  const unattended = members.filter(m => !m.attended);
  const attended = members.filter(m => m.attended);
  const area = document.getElementById('member-area');
  const isOnline = RA.getStatus().online !== false;

  let html = '';
  html += `<div class="section-label unattended"><span class="dot"></span>未出席 ${unattended.length}名</div>`;
  html += '<div class="member-grid large">';
  for (const m of unattended) {
    const sel = selectedIds.has(m.id) ? ' selected' : '';
    html += `<div class="member-card${sel}" onclick="toggleMember(${m.id})">${esc(m.name)}</div>`;
  }
  if (!unattended.length) html += '<div style="padding:24px;color:#aaa;text-align:center;">全員出席済み</div>';
  html += '</div>';

  html += `<div class="section-label attended"><span class="dot"></span>出席済み ${attended.length}名</div>`;
  html += '<div class="member-grid small">';
  for (const m of attended) {
    const cls = isOnline ? '' : ' disabled';
    const handler = isOnline ? `onclick="askCancel(${m.id})"` : '';
    html += `<div class="member-card small-card${cls}" ${handler}>${esc(m.name)}</div>`;
  }
  if (!attended.length) html += '<div style="padding:12px;color:#ccc;text-align:center;">---</div>';
  html += '</div>';

  area.innerHTML = html;
  updateSelectionCount();
}

function toggleMember(id) {
  if (selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  renderMembers();
}

function updateSelectionCount() {
  const c = selectedIds.size;
  document.getElementById('selected-count').textContent = c;
  document.getElementById('btn-to-confirm').disabled = c === 0;
  const bubble = document.getElementById('mascot-bubble');
  if (c > 0) bubble.textContent = '下の「登録する」ボタンを押してください';
  else bubble.textContent = '出席する方の名前をタップしてください';
}

function showConfirmModal() {
  const members = RA.getMembersByClub(currentClubId);
  const selected = members.filter(m => selectedIds.has(m.id));
  const dups = selected.filter(m => m.attended);

  // 重複警告 + リスト本体を組み立てる
  const modal = document.getElementById('confirm-modal');
  const warnEl = modal.querySelector('.modal-warn-slot');
  if (dups.length > 0) {
    warnEl.style.display = 'block';
    warnEl.textContent = `⚠ ${dups.length}名は既に他の受付で登録されています（重複登録は無視されます）`;
  } else {
    warnEl.style.display = 'none';
  }

  document.getElementById('confirm-list').innerHTML = selected.map(m => {
    const cls = m.attended ? ' dup' : '';
    const ts = m.attended ? `<span class="ts">${esc(m.attended_at || '')}</span>` : '';
    return `<li class="modal-item${cls}">${esc(m.name)}${ts}</li>`;
  }).join('');
  modal.classList.add('active');
}
function hideConfirmModal() {
  document.getElementById('confirm-modal').classList.remove('active');
}

function registerAttendance() {
  hideConfirmModal();
  const ids = Array.from(selectedIds);
  if (ids.length === 0) return;
  const members = RA.getMembersByClub(currentClubId);
  const selected = members.filter(m => selectedIds.has(m.id));
  const newOnes = selected.filter(m => !m.attended);
  const dups = selected.filter(m => m.attended);

  RA.enqueueAttend(ids); // 楽観的更新 + バックグラウンド送信

  // done 画面に表示する内訳
  const detail = document.getElementById('done-detail');
  const warn = document.getElementById('done-warn');
  if (newOnes.length > 0) {
    detail.textContent = newOnes.map(m => m.name).join('、') + ' さん（' + newOnes.length + '名）';
  } else {
    detail.textContent = '（新規登録は0名）';
  }
  if (dups.length > 0) {
    const dupList = dups.map(m => `${m.name}（${m.attended_at || '時刻不明'}）`).join('、');
    warn.textContent = `※ ${dups.length}名は既に他の受付で登録されていました: ${dupList}`;
    warn.style.display = 'block';
  } else {
    warn.style.display = 'none';
  }

  selectedIds.clear();
  showScreen('done');
}

function askCancel(id) {
  if (RA.getStatus().online === false) return; // オフライン中は無効
  const m = RA.getMember(id);
  if (!m) return;
  cancelTargetId = id;
  document.getElementById('cancel-name').textContent = m.name + ' さん';
  document.getElementById('cancel-modal').classList.add('active');
}
function hideCancelModal() {
  document.getElementById('cancel-modal').classList.remove('active');
  cancelTargetId = null;
}
function confirmCancel() {
  if (cancelTargetId == null) return;
  RA.enqueueCancel(cancelTargetId);
  hideCancelModal();
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// 接続ステータスバー
function updateConnBar() {
  const s = RA.getStatus();
  const bar = document.getElementById('conn-bar');
  const text = document.getElementById('conn-text');

  if (s.online === false) {
    bar.classList.add('show', 'offline');
    bar.classList.remove('syncing');
    text.textContent = s.queueSize > 0
      ? `オフライン中 ｜ 未送信 ${s.queueSize} 件（自動再送信します）`
      : 'オフライン中（受付は継続できます）';
    document.body.classList.add('has-conn-bar');
  } else if (s.queueSize > 0) {
    bar.classList.add('show', 'syncing');
    bar.classList.remove('offline');
    text.textContent = `同期中 ｜ ${s.queueSize} 件送信中...`;
    document.body.classList.add('has-conn-bar');
  } else {
    bar.classList.remove('show', 'offline', 'syncing');
    document.body.classList.remove('has-conn-bar');
  }
}

// 現在画面のみ再描画
function rerenderCurrent() {
  if (currentScreen === 'groups') renderGroups();
  else if (currentScreen === 'clubs') renderClubs();
  else if (currentScreen === 'members') renderMembers();
}

// トースト通知（自動消失）
let toastTimer = null;
function showToast(message, opts = {}) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = message;
  el.classList.remove('warn');
  if (opts.warn) el.classList.add('warn');
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), opts.duration || 3500);
}

// SSE 同期時の自動プルーン: 別端末で先に登録された人を選択から外す
function pruneSelectionFromSnapshot() {
  if (currentScreen !== 'members' || selectedIds.size === 0) return;
  const members = RA.getMembersByClub(currentClubId);
  const removed = [];
  for (const m of members) {
    if (selectedIds.has(m.id) && m.attended) {
      selectedIds.delete(m.id);
      removed.push(m);
    }
  }
  if (removed.length > 0) {
    const names = removed.map(m => m.name).join('、');
    showToast(`${names} さんは他の受付で登録されました`, { warn: true });
  }
}

RA.on('snapshot', () => {
  pruneSelectionFromSnapshot();
  rerenderCurrent();
  // splash を消す（最初の snapshot が来たら）
  document.getElementById('splash').classList.add('hidden');
});
RA.on('status', updateConnBar);
RA.on('queue', updateConnBar);

(async function () {
  await RA.init();
  rerenderCurrent();
  updateConnBar();
  // snapshot がキャッシュにあった場合の初期描画
  document.getElementById('splash').classList.add('hidden');
})();
</script>
</body>
</html>
