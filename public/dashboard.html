<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>集計ダッシュボード - ロータリー出欠管理</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans JP', -apple-system, sans-serif;
  background: #f4f6fb;
  color: #1e293b;
  min-height: 100vh;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(6, 182, 212, 0.04) 0%, transparent 50%);
  z-index: 0;
}

.header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(99, 102, 241, 0.08);
  padding: 14px 28px;
  display: flex;
  align-items: center;
  gap: 20px;
}
.header h1 {
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 2px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  white-space: nowrap;
}
.header-stats { display: flex; gap: 12px; flex: 1; justify-content: flex-end; }
.stat-box {
  background: white;
  border: 1px solid #e2e8f0;
  padding: 8px 22px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(99, 102, 241, 0.04);
  min-width: 90px;
}
.stat-num {
  font-size: 26px;
  font-weight: 900;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.1;
}
.stat-label { font-size: 11px; color: #94a3b8; letter-spacing: 2px; font-weight: 600; }

.toolbar {
  position: sticky;
  top: 64px;
  z-index: 9;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid #e2e8f0;
  padding: 10px 28px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.toolbar button, .toolbar a {
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid #e2e8f0;
  background: white;
  color: #6366f1;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.15s;
  white-space: nowrap;
}
.toolbar button:hover, .toolbar a:hover { background: #f1f5f9; }
.toolbar .btn-export { border-color: #bbf7d0; color: #16a34a; background: #f0fdf4; }
.toolbar .btn-export:hover { background: #dcfce7; }
.toolbar .btn-reset { border-color: #fecaca; color: #dc2626; background: #fef2f2; }
.toolbar .btn-reset:hover { background: #fee2e2; }
.toolbar .spacer { flex: 1; }

/* ── Connection status ── */
.conn-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  border: 1px solid;
}
.conn-pill.online   { background: #f0fdf4; border-color: #bbf7d0; color: #16a34a; }
.conn-pill.offline  { background: #fef2f2; border-color: #fecaca; color: #dc2626; }
.conn-pill .cdot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.conn-pill.online .cdot { animation: blink 1.5s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
.last-sync { font-size: 11px; color: #94a3b8; letter-spacing: 0.5px; }

/* ── Group filter tabs ── */
.group-tabs {
  position: sticky;
  top: 113px;
  z-index: 8;
  background: #f4f6fb;
  border-bottom: 1px solid #e2e8f0;
  padding: 10px 28px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.group-tab {
  border: 1px solid #e2e8f0;
  background: white;
  color: #64748b;
  padding: 6px 14px;
  border-radius: 18px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
  letter-spacing: 0.5px;
}
.group-tab:hover { background: #f1f5f9; }
.group-tab.active {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  border-color: transparent;
  color: white;
  box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25);
}
.group-tab .tab-count {
  font-size: 10px;
  margin-left: 6px;
  opacity: 0.7;
  font-weight: 500;
}

/* ── Layout ── */
.main {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 20px;
  padding: 20px 28px;
}

/* ── Timeline ── */
.timeline {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  overflow: hidden;
  position: sticky;
  top: 168px;
  align-self: start;
  max-height: calc(100vh - 188px);
  display: flex;
  flex-direction: column;
}
.timeline-head {
  padding: 14px 18px;
  border-bottom: 1px solid #e2e8f0;
  background: #fafbff;
  display: flex;
  align-items: center;
  gap: 10px;
}
.timeline-head h2 {
  font-size: 13px;
  font-weight: 900;
  color: #4338ca;
  letter-spacing: 2px;
}
.timeline-head .pulse {
  width: 8px; height: 8px; border-radius: 50%;
  background: #22c55e; animation: blink 1.4s infinite;
}
.timeline-head .total-count {
  margin-left: auto;
  font-size: 11px;
  color: #94a3b8;
  font-weight: 600;
  letter-spacing: 1px;
}
.timeline-list {
  list-style: none;
  overflow-y: auto;
  flex: 1;
}
.timeline-item {
  padding: 10px 18px;
  border-bottom: 1px solid #f1f5f9;
  display: grid;
  grid-template-columns: 60px 1fr;
  gap: 12px;
  align-items: center;
  transition: background 0.3s;
}
.timeline-item:last-child { border-bottom: none; }
.timeline-item.new {
  background: linear-gradient(90deg, rgba(34, 197, 94, 0.12), transparent 80%);
  animation: tlNew 2s ease-out;
}
@keyframes tlNew {
  0% { background: rgba(34, 197, 94, 0.25); }
  100% { background: transparent; }
}
.timeline-time {
  font-size: 13px;
  font-weight: 700;
  color: #6366f1;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.timeline-name {
  font-size: 14px;
  font-weight: 600;
  color: #1e293b;
  line-height: 1.3;
}
.timeline-club {
  font-size: 11px;
  color: #94a3b8;
  margin-top: 2px;
  letter-spacing: 0.5px;
}
.timeline-empty {
  padding: 40px 20px;
  text-align: center;
  color: #cbd5e1;
  font-size: 13px;
}

/* ── メンバー検索 ── */
.search-section {
  margin: 20px 28px;
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  padding: 16px 20px;
  box-shadow: 0 2px 8px rgba(99, 102, 241, 0.04);
}
.search-section h3 {
  font-size: 13px;
  font-weight: 900;
  color: #4338ca;
  letter-spacing: 2px;
  margin-bottom: 10px;
}
.search-section .search-box {
  position: relative;
}
.search-section input[type="text"] {
  width: 100%;
  padding: 12px 14px 12px 38px;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  background: #fafbff;
}
.search-section input[type="text"]:focus {
  outline: none;
  border-color: #6366f1;
  background: white;
}
.search-section .search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: #94a3b8;
  font-size: 16px;
  pointer-events: none;
}
.search-results {
  margin-top: 12px;
  max-height: 420px;
  overflow-y: auto;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  background: #fafbff;
}
.search-row {
  padding: 10px 14px;
  border-bottom: 1px solid #f1f5f9;
  display: grid;
  grid-template-columns: 160px 140px 1fr auto;
  gap: 14px;
  align-items: center;
  font-size: 13px;
}
.search-row:last-child { border-bottom: none; }
.search-row.attended { background: #f6fdf8; }
.search-row .sr-name { font-weight: 700; color: #1e293b; }
.search-row .sr-kana { font-size: 11px; color: #94a3b8; font-weight: 500; }
.search-row .sr-club { color: #64748b; font-size: 12px; }
.search-row .sr-committee {
  font-weight: 600;
  color: #4338ca;
}
.search-row .sr-room {
  font-size: 11px;
  color: #6366f1;
  font-weight: 500;
}
.search-row .sr-status .badge { font-size: 10px; padding: 2px 10px; border-radius: 10px; font-weight: 700; }
.search-row .sr-status .badge.b-attended { background: #dcfce7; color: #16a34a; }
.search-row .sr-status .badge.b-absent  { background: #fee2e2; color: #dc2626; }
.search-row .sr-status .ts { display: block; font-size: 10px; color: #94a3b8; margin-top: 2px; font-weight: 500; }

@media (max-width: 720px) {
  .search-section { margin: 14px; padding: 12px 14px; }
  .search-row { grid-template-columns: 1fr auto; gap: 8px; padding: 8px 12px; }
  .search-row .sr-name { grid-column: 1; }
  .search-row .sr-status { grid-column: 2; text-align: right; }
  .search-row .sr-club, .search-row .sr-committee { grid-column: 1 / 3; font-size: 11px; }
}

/* ── Group attendance cards (リアルタイム) ── */
.group-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
  margin: 20px 28px;
}
.group-card {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 14px 16px;
  position: relative;
  box-shadow: 0 2px 8px rgba(99, 102, 241, 0.04);
  transition: all 0.2s;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.group-card:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(99, 102, 241, 0.10); }
.group-card:active { transform: scale(0.97); }
/* 役職カード (ガバナー補佐/地区委員長) のアクセント */
.group-card.role-card .gc-name { color: #b8860b; letter-spacing: 1px; }
.group-card.role-card { border-left: 4px solid #d4af37; }
.group-card.active-card {
  box-shadow: 0 4px 20px rgba(99, 102, 241, 0.25);
  border-color: #6366f1;
}
.group-card.role-card.active-card { border-color: #d4af37; box-shadow: 0 4px 20px rgba(184, 134, 11, 0.30); }
.group-card .gc-name {
  font-size: 12px;
  font-weight: 700;
  color: #64748b;
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.group-card .gc-count {
  font-size: 28px;
  font-weight: 900;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.1;
}
.group-card .gc-total {
  font-size: 13px;
  color: #94a3b8;
  font-weight: 600;
}
.group-card .gc-pct {
  font-size: 11px;
  color: #94a3b8;
  position: absolute;
  top: 12px;
  right: 14px;
  font-weight: 700;
}
.group-card .gc-bar {
  margin-top: 10px;
  height: 4px;
  background: #e2e8f0;
  border-radius: 2px;
  overflow: hidden;
}
.group-card .gc-bar > div {
  height: 100%;
  background: linear-gradient(90deg, #6366f1, #8b5cf6);
  border-radius: 2px;
  transition: width 0.4s ease;
}

/* ── Role tag list (ガバナー補佐 + 地区委員長) ── */
.role-section {
  margin: 0 28px 20px;
}
.role-section-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}
.role-section-head h3 {
  font-size: 14px;
  font-weight: 900;
  color: #b8860b;
  letter-spacing: 2px;
}
.role-section-head .role-count {
  font-size: 12px;
  color: #94a3b8;
  font-weight: 600;
}
.role-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
}
.role-item {
  background: linear-gradient(135deg, #fffaf0 0%, #fdf5dc 100%);
  border: 1px solid #e8d493;
  border-radius: 10px;
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all 0.2s;
}
.role-item.attended {
  background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
  border-color: #86efac;
}
.role-item .role-status {
  width: 10px; height: 10px; border-radius: 50%;
  background: #d4af37; flex-shrink: 0;
}
.role-item.attended .role-status { background: #16a34a; }
.role-item .role-body { min-width: 0; flex: 1; }
.role-item .role-name {
  font-size: 13px;
  font-weight: 700;
  color: #1e293b;
}
.role-item .role-club {
  font-size: 11px;
  color: #94a3b8;
  font-weight: 500;
  margin-top: 1px;
}
.role-item .role-ts {
  font-size: 10px;
  color: #16a34a;
  font-weight: 700;
  letter-spacing: 0.5px;
}

/* ── Group breakdown ── */
.breakdown { min-width: 0; }
.group-section { margin-bottom: 20px; }
.group-title {
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 2px;
  margin-bottom: 10px;
  padding: 12px 18px;
  background: white;
  border: 1px solid rgba(99, 102, 241, 0.1);
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: 0 2px 8px rgba(99, 102, 241, 0.04);
  color: #4338ca;
}
.group-title .group-stats {
  font-size: 13px;
  font-weight: 600;
  color: #94a3b8;
  margin-left: auto;
}

details { margin-bottom: 6px; }
summary {
  cursor: pointer;
  padding: 9px 14px;
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
  font-size: 13px;
  transition: all 0.15s;
  list-style: none;
  color: #334155;
}
summary::-webkit-details-marker { display: none; }
summary::before {
  content: '▸';
  font-size: 12px;
  color: #94a3b8;
  transition: transform 0.2s;
}
details[open] summary::before { transform: rotate(90deg); }
summary:hover { background: #f8fafc; border-color: #c7d2fe; }

.progress-bar {
  width: 120px;
  height: 6px;
  background: #e2e8f0;
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #6366f1, #8b5cf6);
  border-radius: 3px;
  transition: width 0.4s ease;
}
.progress-text {
  font-size: 12px;
  color: #94a3b8;
  font-weight: 600;
  margin-left: auto;
  white-space: nowrap;
}

.club-table {
  width: 100%;
  border-collapse: collapse;
  margin: 6px 0;
}
.club-table th {
  background: #f8fafc;
  padding: 7px 12px;
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  color: #94a3b8;
  letter-spacing: 1px;
  border-bottom: 2px solid #e2e8f0;
}
.club-table td {
  padding: 7px 12px;
  border-bottom: 1px solid #f1f5f9;
  font-size: 13px;
  color: #334155;
}
.club-table tr:hover td { background: #f8fafc; }

.badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
}
.badge-attended {
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  color: #16a34a;
}
.badge-absent {
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: #dc2626;
}

/* ── Modal ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.4);
  backdrop-filter: blur(8px);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: white;
  border-radius: 20px;
  padding: 32px;
  max-width: 500px;
  width: 90%;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.12);
}
.modal h2 {
  margin-bottom: 16px;
  font-weight: 900;
  letter-spacing: 1px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.modal p { margin-bottom: 12px; color: #64748b; font-size: 13px; line-height: 1.6; }
.modal code {
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 12px;
  color: #6366f1;
}
.modal .warn { color: #dc2626; font-weight: 600; font-size: 13px; }
.modal input[type="file"] { margin: 12px 0; color: #64748b; }
.modal .btn-row { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
.modal button {
  padding: 10px 24px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.modal .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
.modal .btn-secondary { background: #f1f5f9; border: 1px solid #e2e8f0; color: #64748b; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.12); border-radius: 3px; }

/* ── Tablet ── */
@media (max-width: 1024px) {
  .main { grid-template-columns: 1fr; gap: 16px; }
  .timeline {
    position: relative;
    top: 0;
    max-height: 360px;
    order: -1; /* タイムラインを上に */
  }
  .group-cards { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); margin: 16px 20px; }
  .role-section { margin: 0 20px 16px; }
  .role-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .toolbar { top: 60px; }
  .group-tabs { top: 104px; }
}

/* ── Smartphone ── */
@media (max-width: 720px) {
  .header { padding: 10px 14px; gap: 10px; flex-wrap: wrap; }
  .header h1 { font-size: 15px; letter-spacing: 1px; white-space: nowrap; }
  .header-stats { width: 100%; gap: 6px; justify-content: space-between; }
  .stat-box { flex: 1; padding: 6px 8px; min-width: 0; }
  .stat-num { font-size: 22px; }
  .stat-label { font-size: 10px; letter-spacing: 1px; }

  .toolbar { padding: 8px 14px; top: 92px; gap: 6px; }
  .toolbar button, .toolbar a { padding: 5px 10px; font-size: 11px; }
  .conn-pill { padding: 3px 9px; font-size: 10px; }
  .last-sync { display: none; }

  /* スマホでは「上部のグループタブ」は不要 (カード自体がナビゲーション) */
  .group-tabs { display: none; }

  /* グループ別出席カード: スマホは2列 */
  .group-cards {
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin: 14px;
  }
  .group-card { padding: 10px 12px; border-radius: 10px; }
  .group-card .gc-name { font-size: 11px; margin-bottom: 4px; }
  .group-card .gc-count { font-size: 22px; }
  .group-card .gc-total { font-size: 11px; }
  .group-card .gc-pct { font-size: 10px; top: 10px; right: 10px; }
  .group-card .gc-bar { margin-top: 6px; height: 3px; }

  /* スマホでは詳細リストはデフォルト非表示。カードタップで .active-mobile を付与して展開 */
  .role-section { display: none; margin: 0 14px 14px; }
  .role-section.active-mobile { display: block; }
  .role-section-head h3 { font-size: 12px; letter-spacing: 1px; }
  .role-section-head .role-count { font-size: 10px; }
  .role-grid { grid-template-columns: 1fr; gap: 6px; }
  .role-item { padding: 8px 12px; border-radius: 8px; }
  .role-item .role-name { font-size: 12px; }
  .role-item .role-club { font-size: 10px; }
  .role-item .role-ts { font-size: 9px; }

  .main { padding: 14px; gap: 14px; }
  .timeline { max-height: 320px; border-radius: 12px; top: 0; }
  .timeline-head { padding: 10px 14px; }
  .timeline-head h2 { font-size: 12px; }
  .timeline-item { padding: 8px 14px; grid-template-columns: 50px 1fr; gap: 10px; }
  .timeline-time { font-size: 12px; }
  .timeline-name { font-size: 13px; }
  .timeline-club { font-size: 10px; }

  /* スマホでは breakdown 内の全グループも非表示 → 選択中のみ表示 */
  .breakdown .group-section { display: none; }
  .breakdown .group-section.active-mobile { display: block; }

  .group-section { margin-bottom: 16px; }
  .group-title { font-size: 13px; padding: 10px 14px; gap: 10px; flex-wrap: wrap; }
  .group-title .group-stats { font-size: 11px; }
  .progress-bar { width: 60px; }
  summary { font-size: 12px; padding: 8px 12px; gap: 8px; flex-wrap: wrap; }
  .progress-text { font-size: 11px; }
  .club-table th, .club-table td { padding: 5px 8px; font-size: 11px; }
  .badge { font-size: 9px; padding: 1px 7px; }
}

/* ── Very small (狭いスマホ) ── */
@media (max-width: 380px) {
  .header h1 { display: none; }  /* 統計だけ見せる */
  .header-stats { width: 100%; }
  .toolbar { top: 64px; }
  .group-tabs { top: 106px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>ROTARY DASHBOARD</h1>
  <div class="header-stats">
    <div class="stat-box">
      <div class="stat-num" id="stat-attended">0</div>
      <div class="stat-label">出席</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="stat-total">0</div>
      <div class="stat-label">全体</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="stat-rate">0%</div>
      <div class="stat-label">出席率</div>
    </div>
  </div>
</div>

<div class="toolbar">
  <span class="conn-pill online" id="conn-pill"><span class="cdot"></span><span id="conn-text">オンライン</span></span>
  <span class="last-sync" id="last-sync"></span>
  <div class="spacer"></div>
  <button onclick="showImportModal()">CSV インポート</button>
  <a href="/api/export" class="btn-export">CSV エクスポート</a>
</div>

<div class="group-tabs" id="group-tabs"></div>

<!-- ── メンバー検索 (委員会/部屋表示) ── -->
<div class="search-section">
  <h3>メンバー検索 <span style="font-weight:500;color:#94a3b8;font-size:11px;margin-left:8px;">名前・かな・クラブ・委員会</span></h3>
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="member-search" placeholder="例: 田中、たなか、福岡南、危機管理">
  </div>
  <div class="search-results" id="member-search-results"></div>
</div>

<!-- ── グループ別の出席リアルタイムカード ── -->
<div class="group-cards" id="group-cards"></div>

<!-- ── 役職別の名簿リスト ── -->
<div class="role-section" data-tag="assistant">
  <div class="role-section-head">
    <h3>2026-27年度・ガバナー補佐</h3>
    <span class="role-count" id="role-count-1"></span>
  </div>
  <div class="role-grid" id="role-grid-1"></div>
</div>
<div class="role-section" data-tag="chair">
  <div class="role-section-head">
    <h3>2026-27年度 地区委員長</h3>
    <span class="role-count" id="role-count-2"></span>
  </div>
  <div class="role-grid" id="role-grid-2"></div>
</div>

<div class="main">
  <!-- ── Group breakdown ── -->
  <div class="breakdown" id="breakdown"></div>

  <!-- ── Timeline ── -->
  <div class="timeline">
    <div class="timeline-head">
      <span class="pulse"></span>
      <h2>受付タイムライン</h2>
      <span class="total-count" id="timeline-total">0件</span>
    </div>
    <ul class="timeline-list" id="timeline-list"></ul>
  </div>
</div>

<!-- Import Modal -->
<div class="modal-overlay" id="import-modal">
  <div class="modal">
    <h2>CSV名簿インポート</h2>
    <p>
      CSVフォーマット（ヘッダー行あり）：<br>
      <code>グループ番号,グループ名,クラブ名,名前,フリガナ</code><br><br>
      例：<code>1,第1グループ,中央RC,田中 太郎,たなか たろう</code>
    </p>
    <p class="warn">※ 既存データはすべて上書きされます</p>
    <input type="file" id="csv-file" accept=".csv">
    <div class="btn-row">
      <button class="btn-secondary" onclick="hideImportModal()">キャンセル</button>
      <button class="btn-primary" onclick="doImport()">インポート</button>
    </div>
  </div>
</div>

<script>
let cachedData = null;
let activeGroupId = 'all';
let prevAttendedIds = new Set();
let isFirstRender = true;

async function loadDashboard() {
  let data;
  try {
    const res = await fetch('/api/dashboard', { cache: 'no-store' });
    if (!res.ok) throw new Error('http ' + res.status);
    data = await res.json();
    setConnStatus(true);
    updateLastSync();
  } catch (e) {
    setConnStatus(false);
    return;
  }
  cachedData = data;
  render();
}

function render() {
  if (!cachedData) return;
  const data = cachedData;

  // フィルタ適用
  const filteredClubs = activeGroupId === 'all'
    ? data.clubs
    : data.clubs.filter(c => c.group_id === activeGroupId);
  const filteredMembers = activeGroupId === 'all'
    ? data.members
    : data.members.filter(m => m.group_id === activeGroupId);

  // ヘッダー統計
  const total = filteredClubs.reduce((s, c) => s + c.total, 0);
  const attended = filteredClubs.reduce((s, c) => s + c.attended, 0);
  document.getElementById('stat-attended').textContent = attended;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-rate').textContent = total > 0 ? Math.round(attended / total * 100) + '%' : '0%';

  renderTabs(data);
  renderGroupCards(data);
  renderRoleSections(data);
  renderBreakdown(filteredClubs, filteredMembers);
  renderTimeline(filteredMembers);
  renderMemberSearch(); // 検索結果も最新化
  applyActiveCard(); // SSE更新後も「タップ中のカード」を維持
}

function renderMemberSearch() {
  if (!cachedData) return;
  const q = (document.getElementById('member-search').value || '').trim().toLowerCase();
  const root = document.getElementById('member-search-results');
  const data = cachedData;
  const committees = data.committees || [];
  const cById = {};
  for (const c of committees) cById[c.id] = c;

  let list = data.members;
  if (q) {
    list = list.filter(m => {
      const co = m.committee_id && cById[m.committee_id];
      return (m.name && m.name.toLowerCase().includes(q))
          || (m.name_kana && m.name_kana.toLowerCase().includes(q))
          || (m.club_name && m.club_name.toLowerCase().includes(q))
          || (m.role && m.role.toLowerCase().includes(q))
          || (co && (co.name.toLowerCase().includes(q) || (co.room && co.room.toLowerCase().includes(q))));
    });
  } else {
    list = []; // 検索無しなら何も表示しない (大量に出るのを避ける)
  }

  if (!q) {
    root.innerHTML = '<div style="padding:18px;color:#94a3b8;font-size:12px;text-align:center;">検索ボックスに文字を入力してください</div>';
    return;
  }
  if (list.length === 0) {
    root.innerHTML = '<div style="padding:18px;color:#94a3b8;font-size:12px;text-align:center;">該当なし</div>';
    return;
  }

  // 出席済みを先頭に、その中で時刻新しい順
  list.sort((a, b) => {
    if (!!a.attended !== !!b.attended) return b.attended - a.attended;
    if (a.attended) return (b.attended_at || '').localeCompare(a.attended_at || '');
    return (a.name_kana || '').localeCompare(b.name_kana || '', 'ja');
  });

  // 上限 80件
  const limit = 80;
  const shown = list.slice(0, limit);
  let html = shown.map(m => {
    const co = m.committee_id && cById[m.committee_id];
    const cls = m.attended ? ' attended' : '';
    const status = m.attended
      ? `<span class="badge b-attended">出席</span>${m.attended_at ? `<span class="ts">${formatTime(m.attended_at)}</span>` : ''}`
      : `<span class="badge b-absent">未</span>`;
    return `<div class="search-row${cls}">
      <div>
        <div class="sr-name">${esc(m.name)}</div>
        <div class="sr-kana">${esc(m.name_kana || '')}</div>
      </div>
      <div class="sr-club">${esc(m.club_name)}<br><span style="color:#cbd5e1;font-size:10px;">${esc(m.group_name)}</span></div>
      <div>
        ${co ? `<div class="sr-committee">${esc(co.name)}</div><div class="sr-room">部屋: ${esc(co.room || '-')}</div>` : '<span style="color:#cbd5e1;font-size:11px;">協議会なし</span>'}
      </div>
      <div class="sr-status">${status}</div>
    </div>`;
  }).join('');
  if (list.length > limit) {
    html += `<div style="padding:10px 14px;color:#94a3b8;font-size:11px;text-align:center;">他 ${list.length - limit} 件...</div>`;
  }
  root.innerHTML = html;
}

// カード一覧の定義 (順番: ガバナー補佐 → 地区委員長 → 第1〜第7グループ)
const ROLE_CARDS = [
  { tag: '2026-27年度・ガバナー補佐', label: 'ガバナー補佐' },
  { tag: '協議会主導・委員長',         label: '地区委員長' },
];

function renderGroupCards(data) {
  const cards = [];

  // 役職カードを先頭に
  for (const rc of ROLE_CARDS) {
    const members = data.members.filter(m => m.tag === rc.tag);
    const total = members.length;
    const attended = members.filter(m => m.attended).length;
    cards.push({
      kind: 'tag',
      value: rc.tag,
      label: rc.label,
      total, attended,
      isRole: true,
    });
  }

  // グループ1-7
  const groups = {};
  for (const c of data.clubs) {
    if (c.group_id > 7) continue;
    if (!groups[c.group_id]) groups[c.group_id] = { id: c.group_id, name: c.group_name, total: 0, attended: 0 };
    groups[c.group_id].total += c.total;
    groups[c.group_id].attended += c.attended;
  }
  for (const g of Object.values(groups).sort((a, b) => a.id - b.id)) {
    cards.push({
      kind: 'group',
      value: String(g.id),
      label: g.name,
      total: g.total,
      attended: g.attended,
      isRole: false,
    });
  }

  document.getElementById('group-cards').innerHTML = cards.map(c => {
    const pct = c.total > 0 ? Math.round(c.attended / c.total * 100) : 0;
    const roleClass = c.isRole ? ' role-card' : '';
    return `<div class="group-card${roleClass}" data-kind="${esc(c.kind)}" data-value="${esc(c.value)}">
      <div class="gc-pct">${pct}%</div>
      <div class="gc-name">${esc(c.label)}</div>
      <div><span class="gc-count">${c.attended}</span> <span class="gc-total">/ ${c.total}名</span></div>
      <div class="gc-bar"><div style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  // カードクリックでスマホでは詳細表示、PC では該当セクションへスクロール
  for (const el of document.querySelectorAll('.group-card')) {
    el.addEventListener('click', () => onCardClick(el));
  }
}

let activeCardKey = null;
function onCardClick(el) {
  const kind = el.dataset.kind;
  const value = el.dataset.value;
  const key = kind + ':' + value;
  const isMobile = window.matchMedia('(max-width: 720px)').matches;

  // active 表示の切替 (同じカード再タップで折りたたみ)
  if (activeCardKey === key) {
    activeCardKey = null;
    document.body.classList.remove('mobile-detail-active');
  } else {
    activeCardKey = key;
    document.body.classList.add('mobile-detail-active');
  }
  applyActiveCard();

  // PC ではスクロール、スマホでは表示切替
  if (!isMobile) {
    const target = findSectionForCard(kind, value);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function applyActiveCard() {
  document.querySelectorAll('.group-card.active-card').forEach(el => el.classList.remove('active-card'));
  document.querySelectorAll('.active-mobile').forEach(el => el.classList.remove('active-mobile'));
  if (!activeCardKey) return;
  const [kind, value] = activeCardKey.split(':');
  const card = document.querySelector(`.group-card[data-kind="${kind}"][data-value="${cssEsc(value)}"]`);
  if (card) card.classList.add('active-card');
  const target = findSectionForCard(kind, value);
  if (target) target.classList.add('active-mobile');
}

function findSectionForCard(kind, value) {
  if (kind === 'tag') {
    if (value === '2026-27年度・ガバナー補佐') return document.querySelector('.role-section[data-tag="assistant"]');
    if (value === '協議会主導・委員長')         return document.querySelector('.role-section[data-tag="chair"]');
  } else if (kind === 'group') {
    return document.querySelector(`.group-section[data-group-id="${value}"]`);
  }
  return null;
}

function cssEsc(v) {
  // CSS セレクタで安全に使うため簡易エスケープ
  return String(v).replace(/(["\\])/g, '\\$1');
}

function renderRoleSections(data) {
  renderRoleList(data, '2026-27年度・ガバナー補佐', 'role-grid-1', 'role-count-1');
  renderRoleList(data, '協議会主導・委員長',         'role-grid-2', 'role-count-2');
}

function renderRoleList(data, tag, gridId, countId) {
  const items = data.members.filter(m => m.tag === tag)
    .sort((a, b) => (a.attended_at || 'z').localeCompare(b.attended_at || 'z') || a.name.localeCompare(b.name, 'ja'));
  const attendedCount = items.filter(m => m.attended).length;
  document.getElementById(countId).textContent = `${attendedCount} / ${items.length}名 出席`;
  document.getElementById(gridId).innerHTML = items.map(m => {
    const cls = m.attended ? ' attended' : '';
    const ts = m.attended ? formatTime(m.attended_at) : '';
    return `<div class="role-item${cls}">
      <span class="role-status"></span>
      <div class="role-body">
        <div class="role-name">${esc(m.name)}</div>
        <div class="role-club">${esc(m.club_name)}</div>
      </div>
      ${ts ? `<div class="role-ts">${ts}</div>` : ''}
    </div>`;
  }).join('') || '<div style="color:#cbd5e1;font-size:12px;padding:12px;">該当者なし</div>';
}

function renderTabs(data) {
  // 全体 + 各グループ
  const groups = {};
  for (const c of data.clubs) {
    if (!groups[c.group_id]) groups[c.group_id] = { id: c.group_id, name: c.group_name, total: 0, attended: 0 };
    groups[c.group_id].total += c.total;
    groups[c.group_id].attended += c.attended;
  }
  const sorted = Object.values(groups).sort((a, b) => a.id - b.id);
  const totalAll = sorted.reduce((s, g) => s + g.total, 0);
  const attendedAll = sorted.reduce((s, g) => s + g.attended, 0);

  let html = '';
  const allActive = activeGroupId === 'all' ? ' active' : '';
  html += `<button class="group-tab${allActive}" onclick="setGroupFilter('all')">すべて<span class="tab-count">${attendedAll}/${totalAll}</span></button>`;
  for (const g of sorted) {
    const cls = activeGroupId === g.id ? ' active' : '';
    html += `<button class="group-tab${cls}" onclick="setGroupFilter(${g.id})">${esc(g.name)}<span class="tab-count">${g.attended}/${g.total}</span></button>`;
  }
  document.getElementById('group-tabs').innerHTML = html;
}

function setGroupFilter(gid) {
  activeGroupId = gid;
  render();
}

function renderBreakdown(clubs, members) {
  // group_id でクラブをグルーピング
  const grouped = {};
  for (const c of clubs) {
    if (!grouped[c.group_id]) grouped[c.group_id] = { id: c.group_id, name: c.group_name, clubs: [] };
    grouped[c.group_id].clubs.push(c);
  }

  // クラブ別メンバー
  const membersByClub = {};
  for (const m of members) {
    if (!membersByClub[m.club_name]) membersByClub[m.club_name] = [];
    membersByClub[m.club_name].push(m);
  }

  let html = '';
  const groupList = Object.values(grouped).sort((a, b) => a.id - b.id);
  for (const group of groupList) {
    const gTotal = group.clubs.reduce((s, c) => s + c.total, 0);
    const gAttended = group.clubs.reduce((s, c) => s + c.attended, 0);

    html += `<div class="group-section" data-group-id="${group.id}">`;
    html += `<div class="group-title">${esc(group.name)}
      <span class="group-stats">${gAttended} / ${gTotal} (${gTotal > 0 ? Math.round(gAttended/gTotal*100) : 0}%)</span>
    </div>`;

    for (const club of group.clubs) {
      const pct = club.total > 0 ? Math.round(club.attended / club.total * 100) : 0;
      const clubMembers = membersByClub[club.club_name] || [];
      const sortedMembers = clubMembers.slice().sort((a, b) => {
        // 出席済みを上、その中で時刻降順
        if (a.attended !== b.attended) return b.attended - a.attended;
        if (a.attended) return (b.attended_at || '').localeCompare(a.attended_at || '');
        return a.name.localeCompare(b.name, 'ja');
      });

      html += `<details>`;
      html += `<summary>
        <span>${esc(club.club_name)}</span>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span class="progress-text">${club.attended}/${club.total} (${pct}%)</span>
      </summary>`;

      html += `<table class="club-table"><thead><tr><th>名前</th><th>状態</th><th>出席時刻</th></tr></thead><tbody>`;
      for (const m of sortedMembers) {
        html += `<tr>
          <td>${esc(m.name)}</td>
          <td>${m.attended ? '<span class="badge badge-attended">出席</span>' : '<span class="badge badge-absent">未</span>'}</td>
          <td style="color:#94a3b8;">${m.attended_at || '-'}</td>
        </tr>`;
      }
      html += `</tbody></table></details>`;
    }
    html += `</div>`;
  }

  document.getElementById('breakdown').innerHTML = html;
}

function renderTimeline(members) {
  // 出席済みのみ、時刻降順
  const attended = members.filter(m => m.attended && m.attended_at);
  attended.sort((a, b) => (b.attended_at || '').localeCompare(a.attended_at || ''));
  const top = attended.slice(0, 50);

  // 新着検出 (前回の attended_id セットに無いものを new とマーク)
  const currentIds = new Set(top.map(m => m.id));
  const newIds = new Set();
  if (!isFirstRender) {
    for (const m of top) {
      if (!prevAttendedIds.has(m.id)) newIds.add(m.id);
    }
  }
  prevAttendedIds = currentIds;
  isFirstRender = false;

  document.getElementById('timeline-total').textContent = `${attended.length}件`;

  if (top.length === 0) {
    document.getElementById('timeline-list').innerHTML =
      '<li class="timeline-empty">まだ受付がありません</li>';
    return;
  }

  const html = top.map(m => {
    const cls = newIds.has(m.id) ? ' new' : '';
    return `<li class="timeline-item${cls}">
      <span class="timeline-time">${formatTime(m.attended_at)}</span>
      <div>
        <div class="timeline-name">${esc(m.name)}</div>
        <div class="timeline-club">${esc(m.club_name)} ／ ${esc(m.group_name)}</div>
      </div>
    </li>`;
  }).join('');
  document.getElementById('timeline-list').innerHTML = html;
}

function formatTime(ts) {
  if (!ts) return '-';
  // "2026-05-10 09:30:00" → "09:30:00"
  const m = /(\d{2}):(\d{2}):(\d{2})/.exec(ts);
  return m ? `${m[1]}:${m[2]}` : ts;
}

function esc(str) {
  if (str == null) return '';
  const d = document.createElement('div');
  d.textContent = String(str);
  return d.innerHTML;
}

function showImportModal() { document.getElementById('import-modal').classList.add('active'); }
function hideImportModal() { document.getElementById('import-modal').classList.remove('active'); }

async function doImport() {
  const file = document.getElementById('csv-file').files[0];
  if (!file) { alert('ファイルを選択してください'); return; }
  const form = new FormData();
  form.append('file', file);
  const res = await fetch('/api/import', { method: 'POST', body: form });
  const data = await res.json();
  if (data.ok) {
    alert('インポート完了');
    hideImportModal();
    isFirstRender = true; // 全件 new 扱いを避ける
    prevAttendedIds = new Set();
    loadDashboard();
  } else {
    alert('エラー: ' + data.error);
  }
}

// ── 接続ステータス ──
let lastSyncAt = null;
function setConnStatus(online) {
  const pill = document.getElementById('conn-pill');
  const text = document.getElementById('conn-text');
  if (online) {
    pill.classList.remove('offline');
    pill.classList.add('online');
    text.textContent = 'オンライン';
  } else {
    pill.classList.remove('online');
    pill.classList.add('offline');
    text.textContent = '接続中...';
  }
}
function updateLastSync() {
  lastSyncAt = new Date();
  refreshLastSync();
}
function refreshLastSync() {
  if (!lastSyncAt) return;
  const sec = Math.floor((Date.now() - lastSyncAt.getTime()) / 1000);
  const el = document.getElementById('last-sync');
  if (sec < 5) el.textContent = '最終同期: たった今';
  else if (sec < 60) el.textContent = `最終同期: ${sec} 秒前`;
  else el.textContent = `最終同期: ${Math.floor(sec / 60)} 分前`;
}
setInterval(refreshLastSync, 1000);

// ── SSE 自動再接続 + 連続更新のデバウンス ──
let evtSource = null;
let sseRetryDelay = 1000;
let pendingReload = null;
function scheduleReload() {
  if (pendingReload) return;
  pendingReload = setTimeout(() => {
    pendingReload = null;
    loadDashboard();
  }, 300);
}
function startSSE() {
  if (evtSource) { try { evtSource.close(); } catch (e) {} }
  evtSource = new EventSource('/api/events');
  evtSource.onopen = () => { sseRetryDelay = 1000; setConnStatus(true); };
  evtSource.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.type === 'attendance_update' || data.type === 'data_reload') {
        scheduleReload();
      }
    } catch (err) {}
  };
  evtSource.onerror = () => {
    try { evtSource.close(); } catch (e) {}
    evtSource = null;
    setConnStatus(false);
    setTimeout(startSSE, sseRetryDelay);
    sseRetryDelay = Math.min(sseRetryDelay * 1.5, 10000);
  };
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) loadDashboard();
});

document.getElementById('member-search').addEventListener('input', renderMemberSearch);

startSSE();
loadDashboard();
</script>
