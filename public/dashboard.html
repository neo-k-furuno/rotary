<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>集計ダッシュボード - ロータリー出欠管理</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans JP', -apple-system, sans-serif;
  background: #f4f6fb;
  color: #1e293b;
  min-height: 100vh;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(99, 102, 241, 0.05) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(6, 182, 212, 0.04) 0%, transparent 50%);
  z-index: 0;
}

.header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(99, 102, 241, 0.08);
  padding: 14px 28px;
  display: flex;
  align-items: center;
  gap: 20px;
}
.header h1 {
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 2px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  white-space: nowrap;
}
.header-stats { display: flex; gap: 12px; flex: 1; justify-content: flex-end; }
.stat-box {
  background: white;
  border: 1px solid #e2e8f0;
  padding: 8px 22px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(99, 102, 241, 0.04);
  min-width: 90px;
}
.stat-num {
  font-size: 26px;
  font-weight: 900;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.1;
}
.stat-label { font-size: 11px; color: #94a3b8; letter-spacing: 2px; font-weight: 600; }

.toolbar {
  position: sticky;
  top: 64px;
  z-index: 9;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid #e2e8f0;
  padding: 10px 28px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.toolbar button, .toolbar a {
  padding: 7px 14px;
  border-radius: 8px;
  border: 1px solid #e2e8f0;
  background: white;
  color: #6366f1;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.15s;
  white-space: nowrap;
}
.toolbar button:hover, .toolbar a:hover { background: #f1f5f9; }
.toolbar .btn-export { border-color: #bbf7d0; color: #16a34a; background: #f0fdf4; }
.toolbar .btn-export:hover { background: #dcfce7; }
.toolbar .btn-reset { border-color: #fecaca; color: #dc2626; background: #fef2f2; }
.toolbar .btn-reset:hover { background: #fee2e2; }
.toolbar .spacer { flex: 1; }

/* ── Connection status ── */
.conn-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  border: 1px solid;
}
.conn-pill.online   { background: #f0fdf4; border-color: #bbf7d0; color: #16a34a; }
.conn-pill.offline  { background: #fef2f2; border-color: #fecaca; color: #dc2626; }
.conn-pill .cdot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.conn-pill.online .cdot { animation: blink 1.5s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
.last-sync { font-size: 11px; color: #94a3b8; letter-spacing: 0.5px; }

/* ── Group filter tabs ── */
.group-tabs {
  position: sticky;
  top: 113px;
  z-index: 8;
  background: #f4f6fb;
  border-bottom: 1px solid #e2e8f0;
  padding: 10px 28px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.group-tab {
  border: 1px solid #e2e8f0;
  background: white;
  color: #64748b;
  padding: 6px 14px;
  border-radius: 18px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
  letter-spacing: 0.5px;
}
.group-tab:hover { background: #f1f5f9; }
.group-tab.active {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  border-color: transparent;
  color: white;
  box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25);
}
.group-tab .tab-count {
  font-size: 10px;
  margin-left: 6px;
  opacity: 0.7;
  font-weight: 500;
}

/* ── Layout ── */
.main {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 20px;
  padding: 20px 28px;
}

/* ── Timeline ── */
.timeline {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  overflow: hidden;
  position: sticky;
  top: 168px;
  align-self: start;
  max-height: calc(100vh - 188px);
  display: flex;
  flex-direction: column;
}
.timeline-head {
  padding: 14px 18px;
  border-bottom: 1px solid #e2e8f0;
  background: #fafbff;
  display: flex;
  align-items: center;
  gap: 10px;
}
.timeline-head h2 {
  font-size: 13px;
  font-weight: 900;
  color: #4338ca;
  letter-spacing: 2px;
}
.timeline-head .pulse {
  width: 8px; height: 8px; border-radius: 50%;
  background: #22c55e; animation: blink 1.4s infinite;
}
.timeline-head .total-count {
  margin-left: auto;
  font-size: 11px;
  color: #94a3b8;
  font-weight: 600;
  letter-spacing: 1px;
}
.timeline-list {
  list-style: none;
  overflow-y: auto;
  flex: 1;
}
.timeline-item {
  padding: 10px 18px;
  border-bottom: 1px solid #f1f5f9;
  display: grid;
  grid-template-columns: 60px 1fr;
  gap: 12px;
  align-items: center;
  transition: background 0.3s;
}
.timeline-item:last-child { border-bottom: none; }
.timeline-item.new {
  background: linear-gradient(90deg, rgba(34, 197, 94, 0.12), transparent 80%);
  animation: tlNew 2s ease-out;
}
@keyframes tlNew {
  0% { background: rgba(34, 197, 94, 0.25); }
  100% { background: transparent; }
}
.timeline-time {
  font-size: 13px;
  font-weight: 700;
  color: #6366f1;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.timeline-name {
  font-size: 14px;
  font-weight: 600;
  color: #1e293b;
  line-height: 1.3;
}
.timeline-club {
  font-size: 11px;
  color: #94a3b8;
  margin-top: 2px;
  letter-spacing: 0.5px;
}
.timeline-empty {
  padding: 40px 20px;
  text-align: center;
  color: #cbd5e1;
  font-size: 13px;
}

/* ── Group breakdown ── */
.breakdown { min-width: 0; }
.group-section { margin-bottom: 20px; }
.group-title {
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 2px;
  margin-bottom: 10px;
  padding: 12px 18px;
  background: white;
  border: 1px solid rgba(99, 102, 241, 0.1);
  border-radius: 12px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: 0 2px 8px rgba(99, 102, 241, 0.04);
  color: #4338ca;
}
.group-title .group-stats {
  font-size: 13px;
  font-weight: 600;
  color: #94a3b8;
  margin-left: auto;
}

details { margin-bottom: 6px; }
summary {
  cursor: pointer;
  padding: 9px 14px;
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
  font-size: 13px;
  transition: all 0.15s;
  list-style: none;
  color: #334155;
}
summary::-webkit-details-marker { display: none; }
summary::before {
  content: '▸';
  font-size: 12px;
  color: #94a3b8;
  transition: transform 0.2s;
}
details[open] summary::before { transform: rotate(90deg); }
summary:hover { background: #f8fafc; border-color: #c7d2fe; }

.progress-bar {
  width: 120px;
  height: 6px;
  background: #e2e8f0;
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #6366f1, #8b5cf6);
  border-radius: 3px;
  transition: width 0.4s ease;
}
.progress-text {
  font-size: 12px;
  color: #94a3b8;
  font-weight: 600;
  margin-left: auto;
  white-space: nowrap;
}

.club-table {
  width: 100%;
  border-collapse: collapse;
  margin: 6px 0;
}
.club-table th {
  background: #f8fafc;
  padding: 7px 12px;
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  color: #94a3b8;
  letter-spacing: 1px;
  border-bottom: 2px solid #e2e8f0;
}
.club-table td {
  padding: 7px 12px;
  border-bottom: 1px solid #f1f5f9;
  font-size: 13px;
  color: #334155;
}
.club-table tr:hover td { background: #f8fafc; }

.badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
}
.badge-attended {
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  color: #16a34a;
}
.badge-absent {
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: #dc2626;
}

/* ── Modal ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.4);
  backdrop-filter: blur(8px);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: white;
  border-radius: 20px;
  padding: 32px;
  max-width: 500px;
  width: 90%;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.12);
}
.modal h2 {
  margin-bottom: 16px;
  font-weight: 900;
  letter-spacing: 1px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.modal p { margin-bottom: 12px; color: #64748b; font-size: 13px; line-height: 1.6; }
.modal code {
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 12px;
  color: #6366f1;
}
.modal .warn { color: #dc2626; font-weight: 600; font-size: 13px; }
.modal input[type="file"] { margin: 12px 0; color: #64748b; }
.modal .btn-row { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
.modal button {
  padding: 10px 24px;
  border-radius: 10px;
  border: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.modal .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
.modal .btn-secondary { background: #f1f5f9; border: 1px solid #e2e8f0; color: #64748b; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.12); border-radius: 3px; }

/* ── Tablet ── */
@media (max-width: 1024px) {
  .main { grid-template-columns: 1fr; gap: 16px; }
  .timeline {
    position: relative;
    top: 0;
    max-height: 360px;
    order: -1; /* タイムラインを上に */
  }
}

/* ── Smartphone ── */
@media (max-width: 720px) {
  .header { padding: 10px 14px; gap: 10px; }
  .header h1 { font-size: 15px; letter-spacing: 1px; }
  .header-stats { gap: 6px; }
  .stat-box { padding: 6px 8px; min-width: 60px; }
  .stat-num { font-size: 20px; }
  .stat-label { font-size: 9px; letter-spacing: 1px; }

  .toolbar { padding: 8px 14px; top: 56px; }
  .toolbar button, .toolbar a { padding: 5px 10px; font-size: 11px; }
  .conn-pill { padding: 3px 9px; font-size: 10px; }
  .last-sync { display: none; }

  .group-tabs { padding: 8px 14px; top: 92px; }
  .group-tab { padding: 5px 12px; font-size: 11px; }

  .main { padding: 14px; gap: 14px; }
  .timeline { max-height: 320px; border-radius: 12px; top: 0; }
  .timeline-head { padding: 10px 14px; }
  .timeline-head h2 { font-size: 12px; }
  .timeline-item { padding: 8px 14px; grid-template-columns: 50px 1fr; gap: 10px; }
  .timeline-time { font-size: 12px; }
  .timeline-name { font-size: 13px; }

  .group-section { margin-bottom: 16px; }
  .group-title { font-size: 13px; padding: 10px 14px; gap: 10px; }
  .group-title .group-stats { font-size: 11px; }
  .progress-bar { width: 70px; }
  summary { font-size: 12px; padding: 8px 12px; gap: 8px; }
  .progress-text { font-size: 11px; }
  .club-table th, .club-table td { padding: 5px 8px; font-size: 11px; }
  .badge { font-size: 9px; padding: 1px 7px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>ROTARY DASHBOARD</h1>
  <div class="header-stats">
    <div class="stat-box">
      <div class="stat-num" id="stat-attended">0</div>
      <div class="stat-label">出席</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="stat-total">0</div>
      <div class="stat-label">全体</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="stat-rate">0%</div>
      <div class="stat-label">出席率</div>
    </div>
  </div>
</div>

<div class="toolbar">
  <span class="conn-pill online" id="conn-pill"><span class="cdot"></span><span id="conn-text">オンライン</span></span>
  <span class="last-sync" id="last-sync"></span>
  <div class="spacer"></div>
  <button onclick="showImportModal()">CSV インポート</button>
  <a href="/api/export" class="btn-export">CSV エクスポート</a>
  <button class="btn-reset" onclick="resetAll()">出欠リセット</button>
</div>

<div class="group-tabs" id="group-tabs"></div>

<div class="main">
  <!-- ── Group breakdown ── -->
  <div class="breakdown" id="breakdown"></div>

  <!-- ── Timeline ── -->
  <div class="timeline">
    <div class="timeline-head">
      <span class="pulse"></span>
      <h2>受付タイムライン</h2>
      <span class="total-count" id="timeline-total">0件</span>
    </div>
    <ul class="timeline-list" id="timeline-list"></ul>
  </div>
</div>

<!-- Import Modal -->
<div class="modal-overlay" id="import-modal">
  <div class="modal">
    <h2>CSV名簿インポート</h2>
    <p>
      CSVフォーマット（ヘッダー行あり）：<br>
      <code>グループ番号,グループ名,クラブ名,名前,フリガナ</code><br><br>
      例：<code>1,第1グループ,中央RC,田中 太郎,たなか たろう</code>
    </p>
    <p class="warn">※ 既存データはすべて上書きされます</p>
    <input type="file" id="csv-file" accept=".csv">
    <div class="btn-row">
      <button class="btn-secondary" onclick="hideImportModal()">キャンセル</button>
      <button class="btn-primary" onclick="doImport()">インポート</button>
    </div>
  </div>
</div>

<script>
let cachedData = null;
let activeGroupId = 'all';
let prevAttendedIds = new Set();
let isFirstRender = true;

async function loadDashboard() {
  let data;
  try {
    const res = await fetch('/api/dashboard', { cache: 'no-store' });
    if (!res.ok) throw new Error('http ' + res.status);
    data = await res.json();
    setConnStatus(true);
    updateLastSync();
  } catch (e) {
    setConnStatus(false);
    return;
  }
  cachedData = data;
  render();
}

function render() {
  if (!cachedData) return;
  const data = cachedData;

  // フィルタ適用
  const filteredClubs = activeGroupId === 'all'
    ? data.clubs
    : data.clubs.filter(c => c.group_id === activeGroupId);
  const filteredMembers = activeGroupId === 'all'
    ? data.members
    : data.members.filter(m => m.group_id === activeGroupId);

  // ヘッダー統計
  const total = filteredClubs.reduce((s, c) => s + c.total, 0);
  const attended = filteredClubs.reduce((s, c) => s + c.attended, 0);
  document.getElementById('stat-attended').textContent = attended;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-rate').textContent = total > 0 ? Math.round(attended / total * 100) + '%' : '0%';

  renderTabs(data);
  renderBreakdown(filteredClubs, filteredMembers);
  renderTimeline(filteredMembers);
}

function renderTabs(data) {
  // 全体 + 各グループ
  const groups = {};
  for (const c of data.clubs) {
    if (!groups[c.group_id]) groups[c.group_id] = { id: c.group_id, name: c.group_name, total: 0, attended: 0 };
    groups[c.group_id].total += c.total;
    groups[c.group_id].attended += c.attended;
  }
  const sorted = Object.values(groups).sort((a, b) => a.id - b.id);
  const totalAll = sorted.reduce((s, g) => s + g.total, 0);
  const attendedAll = sorted.reduce((s, g) => s + g.attended, 0);

  let html = '';
  const allActive = activeGroupId === 'all' ? ' active' : '';
  html += `<button class="group-tab${allActive}" onclick="setGroupFilter('all')">すべて<span class="tab-count">${attendedAll}/${totalAll}</span></button>`;
  for (const g of sorted) {
    const cls = activeGroupId === g.id ? ' active' : '';
    html += `<button class="group-tab${cls}" onclick="setGroupFilter(${g.id})">${esc(g.name)}<span class="tab-count">${g.attended}/${g.total}</span></button>`;
  }
  document.getElementById('group-tabs').innerHTML = html;
}

function setGroupFilter(gid) {
  activeGroupId = gid;
  render();
}

function renderBreakdown(clubs, members) {
  // group_id でクラブをグルーピング
  const grouped = {};
  for (const c of clubs) {
    if (!grouped[c.group_id]) grouped[c.group_id] = { id: c.group_id, name: c.group_name, clubs: [] };
    grouped[c.group_id].clubs.push(c);
  }

  // クラブ別メンバー
  const membersByClub = {};
  for (const m of members) {
    if (!membersByClub[m.club_name]) membersByClub[m.club_name] = [];
    membersByClub[m.club_name].push(m);
  }

  let html = '';
  const groupList = Object.values(grouped).sort((a, b) => a.id - b.id);
  for (const group of groupList) {
    const gTotal = group.clubs.reduce((s, c) => s + c.total, 0);
    const gAttended = group.clubs.reduce((s, c) => s + c.attended, 0);

    html += `<div class="group-section">`;
    html += `<div class="group-title">${esc(group.name)}
      <span class="group-stats">${gAttended} / ${gTotal} (${gTotal > 0 ? Math.round(gAttended/gTotal*100) : 0}%)</span>
    </div>`;

    for (const club of group.clubs) {
      const pct = club.total > 0 ? Math.round(club.attended / club.total * 100) : 0;
      const clubMembers = membersByClub[club.club_name] || [];
      const sortedMembers = clubMembers.slice().sort((a, b) => {
        // 出席済みを上、その中で時刻降順
        if (a.attended !== b.attended) return b.attended - a.attended;
        if (a.attended) return (b.attended_at || '').localeCompare(a.attended_at || '');
        return a.name.localeCompare(b.name, 'ja');
      });

      html += `<details>`;
      html += `<summary>
        <span>${esc(club.club_name)}</span>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span class="progress-text">${club.attended}/${club.total} (${pct}%)</span>
      </summary>`;

      html += `<table class="club-table"><thead><tr><th>名前</th><th>状態</th><th>出席時刻</th></tr></thead><tbody>`;
      for (const m of sortedMembers) {
        html += `<tr>
          <td>${esc(m.name)}</td>
          <td>${m.attended ? '<span class="badge badge-attended">出席</span>' : '<span class="badge badge-absent">未</span>'}</td>
          <td style="color:#94a3b8;">${m.attended_at || '-'}</td>
        </tr>`;
      }
      html += `</tbody></table></details>`;
    }
    html += `</div>`;
  }

  document.getElementById('breakdown').innerHTML = html;
}

function renderTimeline(members) {
  // 出席済みのみ、時刻降順
  const attended = members.filter(m => m.attended && m.attended_at);
  attended.sort((a, b) => (b.attended_at || '').localeCompare(a.attended_at || ''));
  const top = attended.slice(0, 50);

  // 新着検出 (前回の attended_id セットに無いものを new とマーク)
  const currentIds = new Set(top.map(m => m.id));
  const newIds = new Set();
  if (!isFirstRender) {
    for (const m of top) {
      if (!prevAttendedIds.has(m.id)) newIds.add(m.id);
    }
  }
  prevAttendedIds = currentIds;
  isFirstRender = false;

  document.getElementById('timeline-total').textContent = `${attended.length}件`;

  if (top.length === 0) {
    document.getElementById('timeline-list').innerHTML =
      '<li class="timeline-empty">まだ受付がありません</li>';
    return;
  }

  const html = top.map(m => {
    const cls = newIds.has(m.id) ? ' new' : '';
    return `<li class="timeline-item${cls}">
      <span class="timeline-time">${formatTime(m.attended_at)}</span>
      <div>
        <div class="timeline-name">${esc(m.name)}</div>
        <div class="timeline-club">${esc(m.club_name)} ／ ${esc(m.group_name)}</div>
      </div>
    </li>`;
  }).join('');
  document.getElementById('timeline-list').innerHTML = html;
}

function formatTime(ts) {
  if (!ts) return '-';
  // "2026-05-10 09:30:00" → "09:30:00"
  const m = /(\d{2}):(\d{2}):(\d{2})/.exec(ts);
  return m ? `${m[1]}:${m[2]}` : ts;
}

function esc(str) {
  if (str == null) return '';
  const d = document.createElement('div');
  d.textContent = String(str);
  return d.innerHTML;
}

function showImportModal() { document.getElementById('import-modal').classList.add('active'); }
function hideImportModal() { document.getElementById('import-modal').classList.remove('active'); }

async function doImport() {
  const file = document.getElementById('csv-file').files[0];
  if (!file) { alert('ファイルを選択してください'); return; }
  const form = new FormData();
  form.append('file', file);
  const res = await fetch('/api/import', { method: 'POST', body: form });
  const data = await res.json();
  if (data.ok) {
    alert('インポート完了');
    hideImportModal();
    isFirstRender = true; // 全件 new 扱いを避ける
    prevAttendedIds = new Set();
    loadDashboard();
  } else {
    alert('エラー: ' + data.error);
  }
}

async function resetAll() {
  if (!confirm('全員の出欠をリセットしますか？\nこの操作は取り消せません。')) return;
  await fetch('/api/reset', { method: 'POST' });
  isFirstRender = true;
  prevAttendedIds = new Set();
  loadDashboard();
}

// ── 接続ステータス ──
let lastSyncAt = null;
function setConnStatus(online) {
  const pill = document.getElementById('conn-pill');
  const text = document.getElementById('conn-text');
  if (online) {
    pill.classList.remove('offline');
    pill.classList.add('online');
    text.textContent = 'オンライン';
  } else {
    pill.classList.remove('online');
    pill.classList.add('offline');
    text.textContent = '接続中...';
  }
}
function updateLastSync() {
  lastSyncAt = new Date();
  refreshLastSync();
}
function refreshLastSync() {
  if (!lastSyncAt) return;
  const sec = Math.floor((Date.now() - lastSyncAt.getTime()) / 1000);
  const el = document.getElementById('last-sync');
  if (sec < 5) el.textContent = '最終同期: たった今';
  else if (sec < 60) el.textContent = `最終同期: ${sec} 秒前`;
  else el.textContent = `最終同期: ${Math.floor(sec / 60)} 分前`;
}
setInterval(refreshLastSync, 1000);

// ── SSE 自動再接続 + 連続更新のデバウンス ──
let evtSource = null;
let sseRetryDelay = 1000;
let pendingReload = null;
function scheduleReload() {
  if (pendingReload) return;
  pendingReload = setTimeout(() => {
    pendingReload = null;
    loadDashboard();
  }, 300);
}
function startSSE() {
  if (evtSource) { try { evtSource.close(); } catch (e) {} }
  evtSource = new EventSource('/api/events');
  evtSource.onopen = () => { sseRetryDelay = 1000; setConnStatus(true); };
  evtSource.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.type === 'attendance_update' || data.type === 'data_reload') {
        scheduleReload();
      }
    } catch (err) {}
  };
  evtSource.onerror = () => {
    try { evtSource.close(); } catch (e) {}
    evtSource = null;
    setConnStatus(false);
    setTimeout(startSSE, sseRetryDelay);
    sseRetryDelay = Math.min(sseRetryDelay * 1.5, 10000);
  };
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) loadDashboard();
});

startSSE();
loadDashboard();
</script>
