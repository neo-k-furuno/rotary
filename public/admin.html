<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理画面 - ロータリー出欠管理</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Sans JP', -apple-system, sans-serif;
  background: #f4f6fb;
  color: #1e293b;
  min-height: 100vh;
  padding: 24px;
}
.container { max-width: 880px; margin: 0 auto; }
h1 {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 2px;
  background: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
}
.subtitle { color: #64748b; font-size: 13px; margin-bottom: 24px; }
.nav { margin-bottom: 20px; display: flex; gap: 8px; }
.nav a {
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid #e2e8f0;
  background: white;
  color: #6366f1;
  text-decoration: none;
  font-size: 12px;
  font-weight: 600;
}
.nav a:hover { background: #f1f5f9; }

.card {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  padding: 22px 26px;
  margin-bottom: 18px;
  box-shadow: 0 2px 8px rgba(99, 102, 241, 0.04);
}
.card h2 {
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 2px;
  color: #4338ca;
  margin-bottom: 14px;
}
.card h2 .badge {
  display: inline-block;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  background: #fdf5dc;
  color: #b8860b;
  margin-left: 8px;
  letter-spacing: 1px;
}
.card p.hint { font-size: 12px; color: #64748b; margin-bottom: 12px; line-height: 1.6; }

label.toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
label.toggle input[type="checkbox"] {
  width: 36px; height: 20px;
  appearance: none;
  background: #cbd5e1;
  border-radius: 10px;
  position: relative;
  cursor: pointer;
  transition: 0.2s;
}
label.toggle input[type="checkbox"]:checked { background: #6366f1; }
label.toggle input[type="checkbox"]::before {
  content: '';
  position: absolute;
  width: 16px; height: 16px;
  background: white;
  border-radius: 50%;
  top: 2px; left: 2px;
  transition: 0.2s;
}
label.toggle input[type="checkbox"]:checked::before { left: 18px; }

textarea, input[type="text"] {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  color: #1e293b;
  background: #fafbff;
  resize: vertical;
  line-height: 1.5;
}
textarea { min-height: 60px; }
textarea:focus, input[type="text"]:focus { outline: none; border-color: #6366f1; background: white; }

/* タグごとのエディタ */
.tag-editor {
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  background: #fafbff;
  transition: all 0.2s;
}
.tag-editor.has-message {
  background: linear-gradient(135deg, #fffaf0 0%, #fdf5dc 100%);
  border-color: #d4af37;
}
.tag-editor-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.tag-editor-name {
  font-size: 14px;
  font-weight: 700;
  color: #1e293b;
}
.tag-editor-count {
  font-size: 11px;
  color: #94a3b8;
  font-weight: 600;
}
.tag-editor-clear {
  margin-left: auto;
  background: transparent;
  border: 1px solid #cbd5e1;
  color: #64748b;
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
}
.tag-editor-clear:hover { background: #f1f5f9; color: #1e293b; }

/* 個別メンバー */
.member-editor {
  border: 1px solid #d4af37;
  background: linear-gradient(135deg, #fffaf0 0%, #fdf5dc 100%);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 10px;
}
.member-editor-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.member-editor-name { font-size: 14px; font-weight: 700; color: #6b4d00; }
.member-editor-club { font-size: 11px; color: #94a3b8; font-weight: 500; }
.member-editor-remove {
  margin-left: auto;
  background: transparent;
  border: 1px solid #d4af37;
  color: #b8860b;
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 700;
  border-radius: 6px;
  cursor: pointer;
}

.search-box { position: relative; margin-bottom: 12px; }
.search-results {
  max-height: 320px;
  overflow-y: auto;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  background: #fafbff;
}
.search-row {
  padding: 9px 14px;
  border-bottom: 1px solid #f1f5f9;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  font-size: 13px;
}
.search-row:hover { background: #f1f5f9; }
.search-row.added { background: #fdf5dc; color: #6b4d00; }
.search-row .meta { color: #94a3b8; font-size: 11px; margin-left: auto; }

.actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 8px; }
.btn-save {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: white;
  border: none;
  padding: 12px 28px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 1px;
}
.btn-save:active { transform: scale(0.98); }
.btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

.toast {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: #16a34a;
  color: white;
  padding: 10px 20px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 700;
  z-index: 100;
  box-shadow: 0 4px 16px rgba(22, 163, 74, 0.30);
  opacity: 0;
  transition: opacity 0.3s;
}
.toast.show { opacity: 1; }
.toast.error { background: #dc2626; box-shadow: 0 4px 16px rgba(220, 38, 38, 0.30); }

.sticky-save {
  position: sticky;
  bottom: 0;
  background: rgba(244, 246, 251, 0.95);
  backdrop-filter: blur(12px);
  margin: -8px -26px 0;
  padding: 16px 26px;
  border-top: 1px solid #e2e8f0;
  display: flex;
  justify-content: flex-end;
  z-index: 10;
}

/* ── メンバー管理セクション ── */
.member-mgmt .actions-row {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
  align-items: center;
  flex-wrap: wrap;
}
.member-mgmt input[type="text"].member-search {
  flex: 1;
  min-width: 200px;
}
.btn-add {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: white;
  border: none;
  padding: 9px 18px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
.btn-add:active { transform: scale(0.98); }

.member-table {
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  overflow: hidden;
  background: #fafbff;
}
.member-table .mt-head, .member-table .mt-row {
  display: grid;
  grid-template-columns: 1.4fr 1.1fr 1.4fr 1fr 1fr 1.4fr 90px;
  gap: 10px;
  padding: 10px 14px;
  align-items: center;
  font-size: 12px;
}
.member-table .mt-head {
  background: #f1f5f9;
  font-weight: 700;
  color: #64748b;
  letter-spacing: 1px;
}
.member-table .mt-row {
  border-top: 1px solid #f1f5f9;
}
.member-table .mt-row:hover { background: #f8fafc; }
.member-table .mt-row .name {
  font-weight: 700;
  color: #1e293b;
  font-size: 13px;
}
.member-table .mt-row .kana { color: #94a3b8; font-size: 11px; }
.member-table .mt-row.attended { background: #f6fdf8; }
.mt-actions { display: flex; gap: 4px; justify-content: flex-end; }
.mt-actions button {
  background: white;
  border: 1px solid #e2e8f0;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
  font-weight: 600;
}
.mt-actions .btn-edit { color: #6366f1; }
.mt-actions .btn-edit:hover { background: #eef2ff; }
.mt-actions .btn-delete { color: #dc2626; }
.mt-actions .btn-delete:hover { background: #fef2f2; }

/* メンバー編集モーダル */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.5);
  backdrop-filter: blur(6px);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: white;
  border-radius: 16px;
  padding: 26px 28px;
  max-width: 480px;
  width: 92%;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.18);
}
.modal-box h3 {
  font-size: 15px;
  font-weight: 900;
  color: #4338ca;
  letter-spacing: 2px;
  margin-bottom: 16px;
}
.modal-box .field { margin-bottom: 12px; }
.modal-box .field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: #64748b;
  margin-bottom: 4px;
  letter-spacing: 0.5px;
}
.modal-box select, .modal-box input[type="text"] {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  font-size: 13px;
  background: #fafbff;
  font-family: inherit;
  color: #1e293b;
}
.modal-box select:focus, .modal-box input[type="text"]:focus {
  outline: none;
  border-color: #6366f1;
  background: white;
}
.modal-box .modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
  justify-content: space-between;
}
.modal-box .left-actions, .modal-box .right-actions { display: flex; gap: 8px; }
.modal-box button {
  padding: 10px 18px;
  border-radius: 8px;
  border: none;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.modal-box .btn-save-modal {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: white;
}
.modal-box .btn-cancel-modal {
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  color: #64748b;
}
.modal-box .btn-delete-modal {
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: #dc2626;
}
.modal-box .btn-delete-modal:hover { background: #fee2e2; }
</style>
</head>
<body>
<div class="container">
  <h1>ROTARY ADMIN</h1>
  <p class="subtitle">控え室案内のメッセージをタグごと・個別に設定</p>

  <div class="nav">
    <a href="/dashboard.html">← ダッシュボードへ</a>
    <a href="/">iPad受付画面へ</a>
  </div>

  <!-- 有効化 -->
  <div class="card">
    <h2>控え室案内 全体スイッチ <span class="badge" id="badge-status">未読込</span></h2>
    <label class="toggle">
      <input type="checkbox" id="enabled">
      <span>受付完了時に控え室案内を表示する</span>
    </label>
    <p class="hint" style="margin-top:8px;">OFFにすると、以下の設定があっても表示されません。</p>
  </div>

  <!-- 大タグごとのメッセージ -->
  <div class="card">
    <h2>大タグごとの案内メッセージ</h2>
    <p class="hint">メッセージが空欄のタグは案内を表示しません。タグごとに違う控え室を指示できます。</p>
    <div id="tag-editors"></div>
  </div>

  <!-- メンバー管理 -->
  <div class="card member-mgmt">
    <h2>メンバー管理 <span class="badge" id="member-count">--</span></h2>
    <p class="hint">名前・かな・クラブ・委員会で検索。各行の「編集」で内容変更、「+新規追加」で受付対象者を追加できます。</p>
    <div class="actions-row">
      <input type="text" class="member-search" id="member-search" placeholder="名前・かな・クラブ・委員会で絞り込み">
      <button class="btn-add" id="btn-add-member">+ 新規追加</button>
    </div>
    <div class="member-table" id="member-table"></div>
  </div>

  <!-- 個別メンバー -->
  <div class="card">
    <h2>個別メンバーへの案内</h2>
    <p class="hint">タグに含まれない特定の人や、タグと異なるメッセージを表示したい人を追加。</p>
    <div id="member-editors"></div>
    <div class="search-box" style="margin-top:14px;">
      <input type="text" id="search" placeholder="名前・フリガナ・クラブで検索して追加">
    </div>
    <div class="search-results" id="search-results"></div>
  </div>

  <div class="sticky-save">
    <button class="btn-save" id="btn-save">保存する</button>
  </div>
</div>

<!-- メンバー編集モーダル -->
<div class="modal-overlay" id="member-modal">
  <div class="modal-box">
    <h3 id="member-modal-title">メンバー編集</h3>
    <input type="hidden" id="m-id">
    <div class="field">
      <label>名前 <span style="color:#dc2626;">*</span></label>
      <input type="text" id="m-name">
    </div>
    <div class="field">
      <label>フリガナ</label>
      <input type="text" id="m-kana">
    </div>
    <div class="field">
      <label>クラブ <span style="color:#dc2626;">*</span></label>
      <select id="m-club"></select>
    </div>
    <div class="field">
      <label>役職</label>
      <input type="text" id="m-role">
    </div>
    <div class="field">
      <label>大タグ</label>
      <select id="m-tag">
        <option value="">(なし)</option>
        <option value="2026-27年度・三役">2026-27年度・三役</option>
        <option value="ゲスト・講演者">ゲスト・講演者</option>
        <option value="2026-27年度・ガバナー補佐">2026-27年度・ガバナー補佐</option>
        <option value="協議会主導・委員長">協議会主導・委員長</option>
        <option value="支援室">支援室</option>
      </select>
    </div>
    <div class="field">
      <label>参加協議会</label>
      <select id="m-committee"></select>
    </div>
    <div class="modal-actions">
      <div class="left-actions">
        <button class="btn-delete-modal" id="btn-delete-member" style="display:none;">削除</button>
      </div>
      <div class="right-actions">
        <button class="btn-cancel-modal" id="btn-cancel-member">キャンセル</button>
        <button class="btn-save-modal" id="btn-save-member">保存</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ALL_TAGS = [
  '2026-27年度・三役',
  'ゲスト・講演者',
  '2026-27年度・ガバナー補佐',
  '協議会主導・委員長',
  '支援室',
];

let snapshot = null;
let lounge = { enabled: true, tags: {}, members: {} };

async function fetchData() {
  const [snapRes, loungeRes] = await Promise.all([
    fetch('/api/snapshot', { cache: 'no-store' }).then(r => r.json()),
    fetch('/api/settings/lounge', { cache: 'no-store' }).then(r => r.ok ? r.json() : null),
  ]);
  snapshot = snapRes;
  if (loungeRes && loungeRes.value) {
    lounge = normalizeLounge(loungeRes.value);
  }
  document.getElementById('badge-status').textContent = '読込完了 / ' + snapshot.members.length + '名';
  render();
}

// 旧形式 (tags=配列+message) が来たら新形式に正規化
function normalizeLounge(raw) {
  const out = { enabled: raw.enabled !== false, tags: {}, members: {} };
  if (Array.isArray(raw.tags)) {
    for (const t of ALL_TAGS) {
      out.tags[t] = { message: raw.tags.includes(t) ? (raw.message || '') : '' };
    }
    for (const id of (raw.member_ids || [])) {
      out.members[String(id)] = { message: raw.message || '' };
    }
  } else {
    for (const t of ALL_TAGS) {
      out.tags[t] = raw.tags && raw.tags[t] ? raw.tags[t] : { message: '' };
    }
    out.members = raw.members || {};
  }
  return out;
}

function render() {
  document.getElementById('enabled').checked = !!lounge.enabled;
  renderTagEditors();
  renderMemberEditors();
  renderSearchResults();
  if (snapshot && snapshot.members) renderMemberTable();
}

function renderTagEditors() {
  document.getElementById('tag-editors').innerHTML = ALL_TAGS.map(t => {
    const count = snapshot.members.filter(m => m.tag === t).length;
    const cfg = lounge.tags[t] || { message: '' };
    const hasMsg = (cfg.message || '').trim().length > 0;
    return `<div class="tag-editor ${hasMsg ? 'has-message' : ''}" data-tag="${esc(t)}">
      <div class="tag-editor-head">
        <span class="tag-editor-name">${esc(t)}</span>
        <span class="tag-editor-count">${count}名</span>
        <button class="tag-editor-clear" data-clear-tag="${esc(t)}">クリア</button>
      </div>
      <textarea placeholder="例: 控え室は2階ホワイエにお越しください" data-msg-tag="${esc(t)}">${esc(cfg.message || '')}</textarea>
    </div>`;
  }).join('');
  for (const ta of document.querySelectorAll('[data-msg-tag]')) {
    ta.addEventListener('input', () => {
      const t = ta.dataset.msgTag;
      lounge.tags[t] = { message: ta.value };
      ta.closest('.tag-editor').classList.toggle('has-message', ta.value.trim().length > 0);
    });
  }
  for (const btn of document.querySelectorAll('[data-clear-tag]')) {
    btn.addEventListener('click', () => {
      const t = btn.dataset.clearTag;
      lounge.tags[t] = { message: '' };
      renderTagEditors();
    });
  }
}

function renderMemberEditors() {
  const ids = Object.keys(lounge.members);
  const root = document.getElementById('member-editors');
  if (ids.length === 0) {
    root.innerHTML = '<p style="color:#94a3b8;font-size:12px;padding:6px;">個別指定なし</p>';
    return;
  }
  root.innerHTML = ids.map(id => {
    const m = snapshot.members.find(x => x.id === Number(id));
    if (!m) return '';
    const cfg = lounge.members[id] || { message: '' };
    return `<div class="member-editor" data-mid="${id}">
      <div class="member-editor-head">
        <span class="member-editor-name">${esc(m.name)}</span>
        <span class="member-editor-club">${esc(m.club_name || '')}</span>
        <button class="member-editor-remove" data-remove-mid="${id}">削除</button>
      </div>
      <textarea placeholder="この方への個別案内" data-msg-mid="${id}">${esc(cfg.message || '')}</textarea>
    </div>`;
  }).join('');
  for (const ta of document.querySelectorAll('[data-msg-mid]')) {
    ta.addEventListener('input', () => {
      lounge.members[ta.dataset.msgMid] = { message: ta.value };
    });
  }
  for (const btn of document.querySelectorAll('[data-remove-mid]')) {
    btn.addEventListener('click', () => {
      delete lounge.members[btn.dataset.removeMid];
      renderMemberEditors();
      renderSearchResults();
    });
  }
}

function renderSearchResults() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const added = new Set(Object.keys(lounge.members).map(Number));
  // club_id → club_name マップ
  const clubName = {};
  for (const c of snapshot.clubs) clubName[c.id] = c.name;

  let list = snapshot.members;
  if (q) {
    list = list.filter(m =>
      (m.name && m.name.toLowerCase().includes(q)) ||
      (m.name_kana && m.name_kana.toLowerCase().includes(q)) ||
      (clubName[m.club_id] && clubName[m.club_id].toLowerCase().includes(q))
    );
  } else {
    list = list.slice(0, 30);
  }
  if (list.length === 0) {
    document.getElementById('search-results').innerHTML = '<div style="padding:14px;color:#94a3b8;font-size:12px;">該当なし</div>';
    return;
  }
  document.getElementById('search-results').innerHTML = list.map(m => {
    const isAdded = added.has(m.id);
    const cls = isAdded ? 'added' : '';
    const tagMeta = m.tag ? `<span class="meta" style="color:#b8860b;">${esc(m.tag)}</span>` : '';
    return `<div class="search-row ${cls}" data-id="${m.id}">
      <span style="font-weight:600;">${esc(m.name)}</span>
      <span style="color:#94a3b8;font-size:11px;">${esc(m.name_kana || '')}</span>
      ${tagMeta}
      <span class="meta">${esc(clubName[m.club_id] || '')}</span>
      <span style="margin-left:auto;font-size:11px;color:${isAdded ? '#16a34a' : '#6366f1'};font-weight:700;">${isAdded ? '追加済' : '+ 追加'}</span>
    </div>`;
  }).join('');
  for (const row of document.querySelectorAll('.search-row')) {
    row.addEventListener('click', () => {
      const id = row.dataset.id;
      if (lounge.members[id]) {
        delete lounge.members[id];
      } else {
        lounge.members[id] = { message: '' };
      }
      renderMemberEditors();
      renderSearchResults();
    });
  }
}

function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

async function save() {
  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  lounge.enabled = document.getElementById('enabled').checked;
  try {
    const res = await fetch('/api/settings/lounge', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ value: lounge }),
    });
    if (!res.ok) throw new Error('http ' + res.status);
    showToast('保存しました');
  } catch (e) {
    showToast('保存失敗: ' + e.message, true);
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('search').addEventListener('input', renderSearchResults);
document.getElementById('btn-save').addEventListener('click', save);

// ── メンバー管理 ──
function renderMemberTable() {
  const root = document.getElementById('member-table');
  const q = (document.getElementById('member-search').value || '').trim().toLowerCase();
  const clubsById = {}; const committeesById = {};
  for (const c of snapshot.clubs) clubsById[c.id] = c;
  for (const c of (snapshot.committees || [])) committeesById[c.id] = c;

  let list = snapshot.members.slice();
  if (q) {
    list = list.filter(m => {
      const cl = clubsById[m.club_id];
      const co = m.committee_id && committeesById[m.committee_id];
      return (m.name && m.name.toLowerCase().includes(q))
          || (m.name_kana && m.name_kana.toLowerCase().includes(q))
          || (cl && cl.name.toLowerCase().includes(q))
          || (m.role && m.role.toLowerCase().includes(q))
          || (m.tag && m.tag.toLowerCase().includes(q))
          || (co && (co.name.toLowerCase().includes(q) || (co.room && co.room.toLowerCase().includes(q))));
    });
  }
  document.getElementById('member-count').textContent = q
    ? `${list.length} / ${snapshot.members.length}名`
    : `${snapshot.members.length}名`;

  list.sort((a, b) => (a.name_kana || '').localeCompare(b.name_kana || '', 'ja'));

  const limit = 200;
  const shown = list.slice(0, limit);
  const head = `<div class="mt-head"><div>名前</div><div>クラブ</div><div>役職</div><div>大タグ</div><div>協議会</div><div>部屋</div><div></div></div>`;
  const rows = shown.map(m => {
    const cl = clubsById[m.club_id];
    const co = m.committee_id && committeesById[m.committee_id];
    return `<div class="mt-row${m.attended ? ' attended' : ''}" data-id="${m.id}">
      <div><div class="name">${esc(m.name)}</div><div class="kana">${esc(m.name_kana || '')}</div></div>
      <div>${esc(cl ? cl.name : '?')}</div>
      <div>${esc(m.role || '')}</div>
      <div>${esc(m.tag || '')}</div>
      <div>${esc(co ? co.name : '')}</div>
      <div>${esc(co ? (co.room || '') : '')}</div>
      <div class="mt-actions">
        <button class="btn-edit" data-action="edit" data-id="${m.id}">編集</button>
      </div>
    </div>`;
  }).join('');
  const overflow = list.length > limit ? `<div style="padding:10px;color:#94a3b8;font-size:11px;text-align:center;">他 ${list.length - limit} 件...</div>` : '';
  root.innerHTML = head + rows + overflow;
  for (const btn of root.querySelectorAll('[data-action="edit"]')) {
    btn.addEventListener('click', () => openMemberModal(Number(btn.dataset.id)));
  }
}

function fillClubOptions() {
  // クラブセレクト (group別 optgroup)
  const sel = document.getElementById('m-club');
  const byGroup = {};
  for (const c of snapshot.clubs) {
    const g = snapshot.groups.find(x => x.id === c.group_id);
    if (!g) continue;
    if (!byGroup[g.id]) byGroup[g.id] = { name: g.name, clubs: [] };
    byGroup[g.id].clubs.push(c);
  }
  sel.innerHTML = Object.entries(byGroup)
    .sort((a, b) => Number(a[0]) - Number(b[0]))
    .map(([gid, g]) =>
      `<optgroup label="${esc(g.name)}">${g.clubs.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</optgroup>`
    ).join('');

  // 委員会セレクト
  const coSel = document.getElementById('m-committee');
  const cos = snapshot.committees || [];
  coSel.innerHTML = '<option value="">(なし)</option>' +
    cos.map(c => `<option value="${c.id}">${esc(c.name)}${c.room ? ' / ' + esc(c.room) : ''}</option>`).join('');
}

function openMemberModal(id) {
  fillClubOptions();
  const modal = document.getElementById('member-modal');
  const delBtn = document.getElementById('btn-delete-member');
  if (id) {
    const m = snapshot.members.find(x => x.id === id);
    if (!m) return;
    document.getElementById('member-modal-title').textContent = 'メンバー編集';
    document.getElementById('m-id').value = m.id;
    document.getElementById('m-name').value = m.name || '';
    document.getElementById('m-kana').value = m.name_kana || '';
    document.getElementById('m-club').value = m.club_id;
    document.getElementById('m-role').value = m.role || '';
    document.getElementById('m-tag').value = m.tag || '';
    document.getElementById('m-committee').value = m.committee_id || '';
    delBtn.style.display = 'inline-block';
  } else {
    document.getElementById('member-modal-title').textContent = '新規メンバー追加';
    document.getElementById('m-id').value = '';
    document.getElementById('m-name').value = '';
    document.getElementById('m-kana').value = '';
    document.getElementById('m-role').value = '';
    document.getElementById('m-tag').value = '';
    document.getElementById('m-committee').value = '';
    delBtn.style.display = 'none';
  }
  modal.classList.add('active');
}

function closeMemberModal() {
  document.getElementById('member-modal').classList.remove('active');
}

async function saveMember() {
  const id = document.getElementById('m-id').value;
  const body = {
    name: document.getElementById('m-name').value.trim(),
    name_kana: document.getElementById('m-kana').value.trim(),
    club_id: Number(document.getElementById('m-club').value),
    role: document.getElementById('m-role').value.trim(),
    tag: document.getElementById('m-tag').value,
    committee_id: document.getElementById('m-committee').value ? Number(document.getElementById('m-committee').value) : null,
  };
  if (!body.name) { showToast('名前を入力してください', true); return; }
  if (!body.club_id) { showToast('クラブを選択してください', true); return; }
  const url = id ? `/api/members/${id}` : '/api/members';
  const method = id ? 'PUT' : 'POST';
  try {
    const res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || ('http ' + res.status));
    }
    showToast(id ? '更新しました' : '追加しました');
    closeMemberModal();
    await fetchData(); // snapshot 再読込
  } catch (e) {
    showToast('保存失敗: ' + e.message, true);
  }
}

async function deleteMember() {
  const id = document.getElementById('m-id').value;
  if (!id) return;
  if (!confirm('このメンバーを削除しますか？\n出席状態など全て消えます。')) return;
  try {
    const res = await fetch(`/api/members/${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error('http ' + res.status);
    showToast('削除しました');
    closeMemberModal();
    await fetchData();
  } catch (e) {
    showToast('削除失敗: ' + e.message, true);
  }
}

document.getElementById('btn-add-member').addEventListener('click', () => openMemberModal(null));
document.getElementById('btn-save-member').addEventListener('click', saveMember);
document.getElementById('btn-cancel-member').addEventListener('click', closeMemberModal);
document.getElementById('btn-delete-member').addEventListener('click', deleteMember);
document.getElementById('member-search').addEventListener('input', renderMemberTable);

fetchData();
</script>
