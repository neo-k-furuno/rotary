<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ログイン - ロータリー出欠管理</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  font-family: 'Noto Sans JP', -apple-system, sans-serif;
  background: linear-gradient(135deg, #f6f7fb 0%, #fdf5dc 100%);
  color: #1e293b;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.card {
  background: white;
  border-radius: 20px;
  padding: 40px 32px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 20px 60px rgba(99, 102, 241, 0.12), 0 4px 14px rgba(0, 0, 0, 0.04);
  border: 1px solid #e2e8f0;
}
.logo {
  text-align: center;
  margin-bottom: 24px;
}
.logo img { height: 64px; width: auto; }
h1 {
  font-size: 17px;
  font-weight: 900;
  letter-spacing: 3px;
  text-align: center;
  margin-bottom: 8px;
  background: linear-gradient(135deg, #c8102e, #b8860b);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.subtitle {
  text-align: center;
  font-size: 12px;
  color: #94a3b8;
  letter-spacing: 1px;
  margin-bottom: 28px;
}
label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: #64748b;
  letter-spacing: 1px;
  margin-bottom: 6px;
}
input[type="password"], input[type="text"] {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  font-size: 18px;
  font-family: inherit;
  letter-spacing: 2px;
  background: #fafbff;
}
input:focus {
  outline: none;
  border-color: #6366f1;
  background: white;
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.10);
}
button {
  width: 100%;
  margin-top: 18px;
  background: linear-gradient(135deg, #c8102e, #a00d24);
  color: white;
  border: none;
  padding: 16px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 2px;
  cursor: pointer;
  box-shadow: 0 2px 10px rgba(200, 16, 46, 0.20);
}
button:active { transform: scale(0.98); }
button:disabled { opacity: 0.6; cursor: not-allowed; }
.error {
  display: none;
  margin-top: 14px;
  padding: 10px 14px;
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: #dc2626;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  letter-spacing: 0.5px;
}
.error.show { display: block; }
.hint {
  text-align: center;
  margin-top: 22px;
  font-size: 11px;
  color: #94a3b8;
  line-height: 1.7;
  letter-spacing: 0.5px;
}
.hint code {
  background: #f1f5f9;
  border: 1px solid #e2e8f0;
  padding: 2px 8px;
  border-radius: 4px;
  font-family: inherit;
  font-weight: 700;
  color: #475569;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="/logo-rotary-district2700.png" alt="Rotary District 2700">
  </div>
  <h1>ROTARY 出欠管理</h1>
  <p class="subtitle">受付スタッフ / 管理者のパスワードを入力してください</p>

  <form id="login-form" autocomplete="off">
    <label for="pw">パスワード</label>
    <input type="password" id="pw" name="password" autocomplete="off" autofocus required>
    <button type="submit" id="btn-submit">ログイン</button>
    <div class="error" id="error">パスワードが違います</div>
  </form>

  <p class="hint">
    一度ログインすると<strong>24時間</strong>有効です。<br>
    iPad はホーム画面に追加するとアプリのように使えます。
  </p>
</div>

<script>
const form = document.getElementById('login-form');
const errorEl = document.getElementById('error');
const btn = document.getElementById('btn-submit');

function getNext() {
  const next = new URLSearchParams(location.search).get('next');
  if (!next || !next.startsWith('/')) return '/';
  return next;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.classList.remove('show');
  btn.disabled = true;
  const pw = document.getElementById('pw').value;
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    });
    if (res.ok) {
      location.href = getNext();
      return;
    }
    errorEl.textContent = 'パスワードが違います';
    errorEl.classList.add('show');
  } catch (e) {
    errorEl.textContent = '通信エラー: ' + e.message;
    errorEl.classList.add('show');
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
